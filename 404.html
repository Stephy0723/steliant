<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Steliant · Portafolio</title>
<meta name="description" content="Steliant — webs, tiendas, reservas, CRMs y bots para negocios en República Dominicana.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Steliant portfolio — navy & teal from the brand star, silk lines, side rail. */
:root{
  --bg:#f3f6fb; --bg-2:#e8eef8; --card:rgba(255,255,255,.72); --card-2:rgba(255,255,255,.92); --line:rgba(11,42,107,.1); --line-2:rgba(11,42,107,.2);
  --ink:#0a1a44; --muted:#5a6788; --navy:#0b2a6b; --navy-2:#1d4ab0; --teal:#0aa59c; --teal-2:#1ec8b8; --glow:rgba(10,165,156,.22); --ok:#10b981;
  --shadow:0 30px 70px -35px rgba(11,42,107,.4); --hl:rgba(255,255,255,.95);
  --grad:linear-gradient(120deg,#0b2a6b,#1d4ab0 40%,#0aa59c 75%,#1ec8b8);
  --f-d:"Syne","Arial Black",sans-serif; --f-b:"DM Sans","Helvetica Neue",Arial,sans-serif; --f-m:"JetBrains Mono",ui-monospace,monospace;
  --ease:cubic-bezier(.19,1,.22,1); --g:clamp(16px,4vw,56px); --rail:88px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#050a1a; --bg-2:#0a1330; --card:rgba(255,255,255,.045); --card-2:rgba(18,28,60,.85); --line:rgba(180,200,255,.1); --line-2:rgba(180,200,255,.2);
  --ink:#eaf1ff; --muted:#93a1c4; --navy:#9db4ff; --navy-2:#5b84ff; --teal:#2ee6d0; --teal-2:#2ee6d0; --glow:rgba(46,230,208,.25);
  --shadow:0 40px 80px -40px rgba(0,0,0,.9); --hl:rgba(255,255,255,.1); --grad:linear-gradient(120deg,#5b84ff,#2ee6d0); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#050a1a; --bg-2:#0a1330; --card:rgba(255,255,255,.045); --card-2:rgba(18,28,60,.85); --line:rgba(180,200,255,.1); --line-2:rgba(180,200,255,.2);
  --ink:#eaf1ff; --muted:#93a1c4; --navy:#9db4ff; --navy-2:#5b84ff; --teal:#2ee6d0; --teal-2:#2ee6d0; --glow:rgba(46,230,208,.25);
  --shadow:0 40px 80px -40px rgba(0,0,0,.9); --hl:rgba(255,255,255,.1); --grad:linear-gradient(120deg,#5b84ff,#2ee6d0); color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:clamp(15px,.95rem + .15vw,17px);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background-color .6s var(--ease),color .6s var(--ease)}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
p{margin:0}
h1,h2,h3,h4{margin:0;font-family:var(--f-d);font-weight:700;line-height:.98;letter-spacing:-.035em;text-wrap:balance}
::selection{background:var(--teal);color:#fff}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:8px}
main{position:relative;z-index:1;margin-left:var(--rail);transform-origin:50% 0}
.wrap{width:100%;max-width:1320px;margin-inline:auto;padding-inline:var(--g)}
.center{display:flex;justify-content:center;margin-top:2.4rem}
.view{display:none}.view.on{display:block}
body.swapping main{opacity:.2;filter:blur(6px);transition:opacity .2s,filter .2s}

/* ambient */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
.b1{width:50vmax;height:50vmax;left:-12vmax;top:-18vmax;background:radial-gradient(circle,rgba(29,74,176,.45),transparent 65%);animation:dr1 26s ease-in-out infinite alternate}
.b2{width:45vmax;height:45vmax;right:-14vmax;top:20vh;background:radial-gradient(circle,rgba(30,200,184,.4),transparent 65%);animation:dr2 30s ease-in-out infinite alternate}
.b3{width:35vmax;height:35vmax;left:30vw;bottom:-20vmax;background:radial-gradient(circle,rgba(91,132,255,.3),transparent 65%);animation:dr1 22s ease-in-out infinite alternate-reverse}
@keyframes dr1{to{transform:translate(20vw,24vh) scale(1.15)}}
@keyframes dr2{to{transform:translate(-24vw,30vh) scale(.9)}}
#field{position:absolute;inset:0}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(500px circle at var(--sx,50%) var(--sy,50%),var(--glow),transparent 60%);opacity:.6}

/* loader */
#loader{position:fixed;inset:0;z-index:300;display:grid;place-items:center;align-content:center;gap:1rem;background:#050a1a;clip-path:circle(150% at 50% 50%);animation:ldOut .6s 3s forwards}
@keyframes ldOut{to{opacity:0;visibility:hidden}}
.ld-star{width:120px;overflow:visible}
.ld-star path,.star-big path,.star-mini path,.cta-star path,.c-star path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.ld-star .ls-a{stroke:#5b84ff;stroke-width:9}.ld-star .ls-b{stroke:#2ee6d0;stroke-width:9}
.ld-word{font:700 2rem var(--f-d);color:#eaf1ff;letter-spacing:-.03em}

/* cursor + progress */
.cursor{display:none}
.has-cursor .cursor{display:grid;place-items:center;position:fixed;left:0;top:0;z-index:400;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--teal);pointer-events:none;transition:width .45s var(--ease),height .45s var(--ease),margin .45s var(--ease),background-color .3s}
.has-cursor .cursor.hover{width:48px;height:48px;margin:-24px 0 0 -24px;background:transparent;border:1.5px solid var(--teal)}
.has-cursor .cursor.view{width:92px;height:92px;margin:-46px 0 0 -46px;background:var(--teal)}
.cursor span{font:600 .62rem var(--f-m);letter-spacing:.08em;text-transform:uppercase;color:#04201d;text-align:center}
.prog{position:fixed;left:0;right:0;top:0;height:3px;z-index:250;pointer-events:none}.prog i{display:block;height:100%;background:var(--grad);transform-origin:left;transform:scaleX(0)}

/* rail */
.rail{position:fixed;left:0;top:0;bottom:0;z-index:60;width:var(--rail);display:flex;flex-direction:column;align-items:center;padding:1.2rem 0;gap:1.2rem;background:var(--card);backdrop-filter:blur(24px) saturate(160%);border-right:1px solid var(--line)}
.r-logo{width:52px;height:52px;display:grid;place-items:center}
.star-mini{width:40px;overflow:visible}
.star-mini .sa,.cta-star .sa,.c-star .sa{stroke:var(--navy-2);stroke-width:10}
.star-mini .sb,.cta-star .sb,.c-star .sb{stroke:var(--teal-2);stroke-width:10}
.r-logo .star-mini{transition:transform 1s var(--ease)}.r-logo:hover .star-mini{transform:rotate(72deg)}
.r-nav{position:relative;display:grid;gap:.3rem;margin-top:1.5rem}
.rn{position:relative;z-index:1;display:grid;justify-items:center;gap:.15rem;width:68px;padding:.7rem 0;border-radius:18px;color:var(--muted);transition:color .3s}
.rn svg{width:22px;height:22px}
.rn span{font-size:.62rem;font-weight:600}
.rn em{position:absolute;top:.35rem;right:.45rem;font:500 .5rem var(--f-m);font-style:normal;opacity:.6}
.rn:hover{color:var(--ink)}
.rn.on{color:#fff}
.rn-ink{position:absolute;left:0;top:0;width:68px;border-radius:18px;background:var(--grad);box-shadow:0 12px 26px -12px var(--teal);transition:transform .6s var(--ease),height .6s var(--ease)}
.r-tools{margin-top:auto;display:grid;gap:.5rem}
.r-btn{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);font:700 .74rem var(--f-m);transition:background-color .3s,transform .4s var(--ease)}
.r-btn:hover{transform:translateY(-2px);background:var(--card-2)}
.r-btn svg{width:19px}
.theme-btn .sun,#themeBtn .sun{display:none}
:root[data-theme="dark"] #themeBtn .sun{display:block}:root[data-theme="dark"] #themeBtn .moon{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #themeBtn .sun{display:block}:root:not([data-theme="light"]) #themeBtn .moon{display:none}}
.mtop,.mnav{display:none}

/* type */
.kick{display:flex;align-items:center;gap:.7rem;font:500 .74rem var(--f-m);letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
.kick::before{content:"";width:28px;height:2px;border-radius:2px;background:var(--grad)}
.chars .ln{display:block;overflow:hidden;padding:0 .04em .1em 0;perspective:600px}
.chars .wd{display:inline-block;white-space:nowrap}
.chars .ch{display:inline-block;will-change:transform}
.chars .accent .ch{background:var(--grad);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.v-lede,.h-lede{color:var(--muted);max-width:52ch;font-size:1.08rem}

/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.55rem;height:54px;padding:0 1.6rem;border-radius:16px;font-weight:700;font-size:.95rem;white-space:nowrap;overflow:hidden;isolation:isolate;transition:transform .5s var(--ease),box-shadow .5s,background-color .3s,color .3s,border-color .3s}
.btn.sm{height:42px;padding:0 1rem;font-size:.84rem;border-radius:12px}
.btn-main{color:#fff;background:var(--grad);background-size:200% 100%;box-shadow:0 16px 34px -14px var(--navy-2);transition:background-position .8s var(--ease),box-shadow .5s,transform .5s var(--ease)}
.btn-main:hover{background-position:100% 0;box-shadow:0 20px 40px -12px var(--teal)}
.btn-main::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);transition:transform .9s var(--ease)}
.btn-main:hover::after{transform:translateX(120%)}
.btn-line{border:1.5px solid var(--line-2);background:var(--card);backdrop-filter:blur(12px)}
.btn-line:hover{border-color:var(--teal);color:var(--teal)}
.btn-ghost{color:var(--muted)}.btn-ghost:hover{color:var(--ink)}
.arr{font-style:normal;transition:transform .5s var(--ease)}.btn:hover .arr{transform:translateX(5px)}
.btn.busy{pointer-events:none;opacity:.8}.btn.ok{background:var(--ok)}
.btn svg{width:17px}

/* hero */
.hero{position:relative;min-height:100svh;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:2rem;padding:4rem var(--g) 2rem;max-width:1400px;margin:0 auto}
.hero-copy{display:grid;gap:1.4rem;justify-items:start;z-index:2}
.h-title{font-size:clamp(3.2rem,7.4vw,7.6rem);font-weight:800}
.ctas{display:flex;flex-wrap:wrap;gap:.7rem}
.orbit-wrap{position:relative;height:min(620px,72vh);perspective:900px;display:grid;place-items:center}
.star-big{width:min(320px,60%);overflow:visible;transition:transform 1.2s var(--ease);filter:drop-shadow(0 30px 50px rgba(11,42,107,.35));animation:float 7s ease-in-out infinite}
.star-big .sa{stroke:url(#ga);stroke-width:10}.star-big .sb{stroke:url(#gb);stroke-width:10}
@keyframes float{50%{translate:0 -14px}}
.orbit{position:absolute;left:50%;top:50%;width:0;height:0}
.chip{position:absolute;left:0;top:0;display:flex;align-items:center;gap:.45rem;padding:.5rem .85rem .5rem .5rem;border-radius:99px;background:var(--card-2);backdrop-filter:blur(16px);border:1px solid var(--line);box-shadow:var(--shadow);font-weight:700;font-size:.82rem;white-space:nowrap;transition:box-shadow .3s}
.chip i{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b))}
.chip:hover{box-shadow:0 0 0 2px var(--teal),var(--shadow)}
.ring{position:absolute;left:50%;top:50%;border-radius:50%;border:1px dashed var(--line-2);transform:translate(-50%,-50%) rotateX(72deg)}
.r1{width:92%;aspect-ratio:1;animation:spin 40s linear infinite}.r2{width:70%;aspect-ratio:1;border-style:solid;border-color:var(--line);animation:spin 30s linear infinite reverse}
@keyframes spin{to{transform:translate(-50%,-50%) rotateX(72deg) rotate(360deg)}}
.stats{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;border-top:1px solid var(--line-2);padding-top:1.4rem}
.stats div{display:grid}
.stats strong{font:800 clamp(2.2rem,4vw,3.4rem)/1 var(--f-d);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stats span{color:var(--muted);font-size:.86rem}

/* quote on home */
.quote-home[hidden]{display:none}
.quote-home{margin-top:1rem}
.qh{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:1.4rem;align-items:center;padding:1.4rem;border-radius:28px;background:var(--card-2);backdrop-filter:blur(20px);border:1px solid var(--line);box-shadow:var(--shadow)}
.qh::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:var(--grad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.qh-ico{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--grad);color:#fff}.qh-ico svg{width:30px}
.qh-main{display:grid;gap:.4rem}.qh-main h3{font-size:1.8rem}.qh-main>p{color:var(--muted);font-size:.9rem}
.qh-steps{display:flex;gap:.4rem;flex-wrap:wrap}
.qh-steps span{padding:.3rem .75rem;border-radius:99px;border:1px solid var(--line-2);font-size:.76rem;color:var(--muted)}
.qh-steps .done{background:var(--ok);border-color:var(--ok);color:#fff}.qh-steps .now{border-color:var(--teal);color:var(--teal);animation:pul 1.8s infinite}
@keyframes pul{0%{box-shadow:0 0 0 0 var(--glow)}70%{box-shadow:0 0 0 10px transparent}}
.qh-price{display:grid;justify-items:end;gap:.2rem;text-align:right}
.qh-price small{color:var(--muted);font-size:.76rem}
.qh-price b{font:800 2rem var(--f-d);letter-spacing:-.04em}.qh-price em{font:500 .9rem var(--f-b);font-style:normal;color:var(--muted)}
.qh-act{display:flex;gap:.3rem;margin-top:.4rem}

/* sections */
.sec{padding:clamp(5rem,9vw,8rem) 0}
.s-head{display:grid;gap:1rem;margin-bottom:2.6rem;justify-items:start}
.s-head h2,.cta-box h2{font-size:clamp(2.3rem,5vw,4.6rem)}
.vhead{display:grid;gap:1.1rem;justify-items:start;padding-top:clamp(5rem,10vw,8rem);padding-bottom:2.6rem}
.vhead h1{font-size:clamp(3rem,7vw,6.4rem);font-weight:800}

/* mock previews */
.mock{position:relative;border-radius:16px;overflow:hidden;background:#0b1430;border:1px solid rgba(255,255,255,.1);box-shadow:0 24px 50px -24px rgba(5,10,26,.7)}
.mk-bar{display:flex;align-items:center;gap:5px;height:26px;padding:0 10px;background:rgba(255,255,255,.06)}
.mk-bar i{width:7px;height:7px;border-radius:50%;background:#ff5f57}.mk-bar i:nth-child(2){background:#febc2e}.mk-bar i:nth-child(3){background:#28c840}
.mk-bar span{margin-left:8px;font:500 .55rem var(--f-m);color:rgba(255,255,255,.45)}
.mk-view{height:190px;overflow:hidden}
.mock.big .mk-view{height:300px}
.mk-scroll{display:grid;gap:10px;padding:10px;transition:transform 4s cubic-bezier(.45,0,.25,1)}
.pc:hover .mk-scroll,.fc:hover .mk-scroll,.dr-panel .mk-scroll{transform:translateY(-45%)}
.dr-panel .mk-scroll{animation:mkscroll 9s ease-in-out infinite alternate;transition:none}
@keyframes mkscroll{to{transform:translateY(-45%)}}
.mk-nav{display:flex;align-items:center;gap:6px}
.mk-nav b{width:18px;height:18px;border-radius:6px;background:var(--a)}.mk-nav span{width:28px;height:5px;border-radius:5px;background:rgba(255,255,255,.2)}.mk-nav span:first-of-type{margin-left:auto}
.mk-nav em{width:38px;height:14px;border-radius:5px;background:var(--b)}
.mk-hero{position:relative;display:grid;grid-template-columns:1.2fr 1fr;gap:8px;align-items:center;height:120px;padding:12px;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--b));overflow:hidden}
.mock.big .mk-hero{height:170px}
.mk-hero div{display:grid;gap:6px}.mk-hero i{height:9px;border-radius:5px;background:rgba(255,255,255,.85)}.mk-hero i.s{width:60%;background:rgba(255,255,255,.5)}
.mk-hero em{width:56px;height:16px;border-radius:6px;background:var(--c)}
.mk-shape{justify-self:center;width:70%;aspect-ratio:1;border-radius:30% 70% 60% 40%;background:rgba(255,255,255,.25);animation:blob 8s ease-in-out infinite}
@keyframes blob{50%{border-radius:60% 40% 30% 70%;transform:rotate(30deg)}}
.mk-hero.alt{grid-template-columns:1fr;height:80px;background:linear-gradient(135deg,var(--b),var(--c))}
.mk-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mk-cards i{height:64px;border-radius:10px;background:rgba(255,255,255,.08);border-top:3px solid var(--b)}
.mk-rows{display:grid;gap:6px}.mk-rows i{height:16px;border-radius:6px;background:rgba(255,255,255,.07)}.mk-rows i:nth-child(2){width:80%}

/* featured */
.feat{display:grid;gap:1.4rem;perspective:1400px}
.fc{display:grid;grid-template-columns:1.25fr 1fr;gap:2rem;align-items:center;padding:1.4rem;border-radius:32px;background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;transition:border-color .4s}
.fc:hover{border-color:var(--teal)}
.fc1{grid-template-columns:1fr 1.25fr}.fc1 .mock{order:2}
.fc-info{display:grid;gap:.8rem;justify-items:start}
.fc-info h3{font-size:clamp(2rem,3.6vw,3.2rem)}
.fc-info p{color:var(--muted)}
.fc-price{font:600 .9rem var(--f-m);color:var(--teal)}
.cat{display:inline-flex;align-items:center;gap:.35rem;padding:.3rem .7rem;border-radius:99px;background:var(--bg-2);font:600 .7rem var(--f-m);letter-spacing:.06em;text-transform:uppercase;color:var(--navy-2)}
.cat svg{width:14px}

/* why */
.why-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.why-c{display:grid;gap:.6rem;align-content:start;padding:1.5rem;border-radius:26px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(16px);transition:border-color .4s}
.why-c:hover{border-color:var(--teal)}
.why-n{font:800 2.6rem/1 var(--f-d);color:transparent;-webkit-text-stroke:1.5px var(--teal)}
.why-c b{font:700 1.25rem var(--f-d);letter-spacing:-.02em}.why-c p{color:var(--muted);font-size:.92rem}

/* cta */
.cta-box{position:relative;display:grid;justify-items:center;gap:1.2rem;text-align:center;padding:clamp(3rem,7vw,6rem) 1.5rem;border-radius:40px;background:var(--navy);color:#fff;overflow:hidden;isolation:isolate}
:root[data-theme="dark"] .cta-box{background:#0d1a42}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cta-box{background:#0d1a42}}
.cta-box p{color:rgba(255,255,255,.75);max-width:44ch}
.cta-box .chars .accent .ch{background:linear-gradient(120deg,#2ee6d0,#9db4ff,#2ee6d0);background-size:300% 100%;-webkit-background-clip:text;background-clip:text}
.cta-star{position:absolute;right:-60px;bottom:-80px;z-index:-1;width:360px;opacity:.25}
.cta-star svg{width:100%;overflow:visible}

/* projects */
.filters{position:relative;display:flex;flex-wrap:wrap;gap:.3rem;width:max-content;max-width:100%;padding:5px;border-radius:18px;background:var(--card);border:1px solid var(--line);backdrop-filter:blur(16px);margin-bottom:1.8rem}
.filters button{position:relative;z-index:1;display:flex;align-items:center;gap:.4rem;padding:.6rem 1rem;border-radius:13px;font-weight:600;font-size:.88rem;transition:color .3s}
.filters em{font:600 .62rem var(--f-m);font-style:normal;padding:.1rem .4rem;border-radius:6px;background:var(--bg-2);color:var(--muted)}
.filters .on{color:#fff}.filters .on em{background:rgba(255,255,255,.2);color:#fff}
.f-ink,.pt-ink,.ct-ink{position:absolute;left:4px;top:4px;bottom:4px;border-radius:13px;background:var(--grad);transition:transform .55s var(--ease),width .55s var(--ease)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.2rem;perspective:1400px;padding-bottom:6rem}
.pc{position:relative;display:flex;flex-direction:column;border-radius:26px;background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;transition:border-color .4s}
.pc:hover{border-color:var(--teal)}

    b.classList.remove("busy"); b.classList.add("ok"); b.innerHTML = `${svg("M5 12.5l4.5 4.5L19 7.5")}<span>${t().quote.sent}</span>`;
    quote = { name, biz: $("#q-biz").value.trim(), base: calc.base, extras: [...calc.extras], term: calc.term, ...calcOut(), at: Date.now() }; store.set("sp-quote", JSON.stringify(quote));
    setTimeout(() => { closeModal(); go("inicio"); setTimeout(() => { renderQuoteHome(); toast(t().contact.sent); showFab(true); const q = $("#quoteHome"); scrollTo({ top: q.getBoundingClientRect().top + scrollY - 40, behavior: "smooth" }); hasG && !reduce && gsap.fromTo(q, { y: 60, opacity: 0, scale: 0.96 }, { y: 0, opacity: 1, scale: 1, duration: 1.2, ease: "expo.out", delay: 0.3 }); }, 1300); }, 1200);
  }, 1400);
});
function renderQuoteHome() {
  const q = $("#quoteHome"); if (!quote) { q.hidden = true; $("#fab").hidden = true; return; }

    <div class="qh-steps"><span class="done">${Q.sent}</span><span class="now">${lang === "en" ? "Proposal in 24 h" : "Propuesta en 24 h"}</span><span>${lang === "en" ? "Kick-off" : "Arranque"}</span></div></div>
    <div class="qh-price"><small>${quote.term ? PR.monthlyFee : PR.total}</small><b>${money(quote.term ? quote.monthly : quote.total)}${quote.term ? `<em>${PR.perMonth}</em>` : ""}</b><small>${quote.term ? `${quote.term} ${t().work.months} · ${lang === "en" ? "no down payment" : "sin inicial"}` : ""}</small><div class="qh-act"><a href="#precios" class="btn btn-line sm" data-goto="calc" data-qload>${Q.open}</a><button type="button" class="btn btn-ghost sm" id="qClear">${Q.clear}</button></div></div></div>`;

function showFab(b) { const f = $("#fab"); if (!quote) return; f.hidden = false; if (b && hasG && !reduce) gsap.fromTo(f, { scale: 0, rotate: -30 }, { scale: 1, rotate: 0, duration: 1.1, ease: "elastic.out(1,.5)" }); }
$("#fab").addEventListener("click", () => { const doit = () => { const q = $("#quoteHome"); scrollTo({ top: q.getBoundingClientRect().top + scrollY - 40, behavior: "smooth" }); hasG && gsap.fromTo(".qh", { boxShadow: "0 0 0 0 rgba(30,200,184,.7)" }, { boxShadow: "0 0 0 20px rgba(30,200,184,0)", duration: 1.2, repeat: 1 }); }; if (current !== "inicio") { go("inicio"); setTimeout(doit, 1300); } else doit(); });
document.addEventListener("click", (e) => {
  if (e.target.closest("#qClear")) { quote = null; store.del("sp-quote"); renderQuoteHome(); }
  if (e.target.closest("[data-qload]") && quote) { calc = { base: quote.base, extras: [...quote.extras], term: quote.term }; renderCalc(); }
});

/* ---------- Process + contact ---------- */
function renderProcess() {
  const PC = t().process;
  $("#timeline").innerHTML = `<div class="tl-line"><i></i></div>` + PC.steps.map(([a, b, w], i) => `<div class="tl-step ${i % 2 ? "r" : "l"}"><span class="tl-dot">${i + 1}</span><div class="tl-card"><em>${w}</em><b>${a}</b><p>${b}</p></div></div>`).join("");
  $("#faq").innerHTML = PC.faq.map(([q, a]) => `<details class="qa"><summary>${q}<i></i></summary><p>${a}</p></details>`).join("");
}
function renderContact() {
  const C = t().contact, PR = t().pricing, wa = `https://wa.me/${CONTACT.whatsapp}?text=${encodeURIComponent(lang === "en" ? "Hi Steliant! I'd like a quote for my project." : "¡Hola Steliant! Quiero cotizar mi proyecto.")}`;
  $("#contactBox").innerHTML = `<form class="cform" id="cForm" novalidate><div class="fl-grid">${[["name", C.name, ""], ["biz", C.biz, ""], ["phone", C.phone, ""]].map(([k, l]) => `<div class="fl"><input id="c-${k}" placeholder=" " autocomplete="off"><label for="c-${k}">${l}</label></div>`).join("")}<div class="fl sel"><select id="c-type">${Object.keys(PKGS).map((k) => `<option value="${k}">${PR.pkgs[k][0]}</option>`).join("")}</select><label for="c-type">${C.type}</label></div><div class="fl wide"><textarea id="c-msg" placeholder=" " rows="4"></textarea><label for="c-msg">${C.msg}</label></div></div><button type="submit" class="btn btn-main mag">${C.send}<i class="arr">→</i></button></form>
    <aside class="cside"><a class="wa-btn" href="${wa}" target="_blank" rel="noopener"><span>${svg("M4 20l1.3-3.9A8 8 0 1 1 8 19zM9 9.5c.5 2 2.5 4 4.5 4.5l1-1 2 1")}</span><b>${C.wa}</b><i>→</i></a>
      ${CONTACT.email ? `<a class="ci" href="mailto:${CONTACT.email}">${svg("M3 6h18v12H3zM3 7l9 6 9-6")}<span>${CONTACT.email}</span></a>` : ""}
      <div class="ci">${svg("M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z")}<span><small>${C.where}</small>${CONTACT.city}</span></div><div class="ci">${svg("M12 7v5l3 2M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0")}<span>${C.hours}</span></div>
      <div class="c-star" aria-hidden="true"><svg viewBox="0 0 100 100"><path class="sa" d="${STAR.a}"/><path class="sb" d="${STAR.b}"/></svg></div></aside>`;

document.addEventListener("submit", (e) => {
  if (e.target.id !== "cForm") return; e.preventDefault();
  if ($("#c-name").value.trim().length < 2 || $("#c-phone").value.trim().length < 7) { toast(t().contact.need); return; }
  toast(t().contact.sent); e.target.reset(); hasG && gsap.fromTo(".cform", { scale: 0.98 }, { scale: 1, duration: 0.6, ease: "elastic.out(1,.4)" });
});

/* ---------- Theme + language ---------- */
const root = document.documentElement;
const sv = store.get("sp-theme"); if (sv) root.dataset.theme = sv;
const isDark = () => (root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches);
$("#themeBtn").addEventListener("click", (e) => {
  const next = isDark() ? "light" : "dark", swap = () => { root.dataset.theme = next; store.set("sp-theme", next); };
  if (!document.startViewTransition || reduce) return swap();
  const r = e.currentTarget.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2, end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  document.startViewTransition(swap).ready.then(() => root.animate({ clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${end}px at ${x}px ${y}px)`] }, { duration: 850, easing: "cubic-bezier(.19,1,.22,1)", pseudoElement: "::view-transition-new(root)" })).catch(() => {});
});
$("#langBtn").addEventListener("click", () => { lang = lang === "es" ? "en" : "es"; store.set("sp-lang", lang); document.body.classList.add("swapping"); setTimeout(() => { renderStatic(); document.body.classList.remove("swapping"); buildMotion(false); }, 220); });

/* ---------- Views ---------- */
let pendingScroll = null;
function markActive() {
  $$("[data-view]").forEach((a) => a.classList.toggle("on", a.dataset.view === current));
  const on = $("#rNav .on"), ink = $(".rn-ink"); if (on && ink) { ink.style.transform = `translateY(${on.offsetTop}px)`; ink.style.height = on.offsetHeight + "px"; }
}
function showView(id, animate) {
  if (!VIEWS.some(([v]) => v === id)) id = "inicio";
  const swap = () => {
    $$(".view").forEach((v) => v.classList.toggle("on", v.id === "v-" + id)); current = id; markActive(); document.body.classList.remove("menu-on");
    if (id === "inicio") renderQuoteHome();
    scrollTo(0, 0); buildMotion(true);
    if (pendingScroll) { const target = $("#" + pendingScroll); pendingScroll = null; if (target) setTimeout(() => scrollTo({ top: target.getBoundingClientRect().top + scrollY - 30, behavior: "smooth" }), animate ? 900 : 100); }
  };
  if (!animate || !hasG || reduce) return swap();
  const m = $("#app");
  gsap.timeline()
    .set(".prog i", { scaleX: 0, opacity: 1 })
    .to(".prog i", { scaleX: 0.7, duration: 0.45, ease: "power2.out" }, 0)
    .to(m, { y: -40, scale: 0.97, opacity: 0, filter: "blur(10px)", duration: 0.45, ease: "power3.in" }, 0)
    .add(swap)
    .fromTo(m, { y: 90, scale: 0.985, opacity: 0, filter: "blur(10px)" }, { y: 0, scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.9, ease: "expo.out", clearProps: "transform,filter" })
    .to(".prog i", { scaleX: 1, duration: 0.3 }, "<").to(".prog i", { opacity: 0, duration: 0.3 });
}
function go(id) { try { history.pushState(null, "", "#" + id); } catch (e) {} if (id === current && pendingScroll) { const target = $("#" + pendingScroll); pendingScroll = null; if (target) scrollTo({ top: target.getBoundingClientRect().top + scrollY - 30, behavior: "smooth" }); return; } showView(id, true); }
document.addEventListener("click", (e) => { const a = e.target.closest('a[href^="#"]'); if (!a) return; const id = a.getAttribute("href").slice(1); if (!id) return; e.preventDefault(); go(id); });
addEventListener("popstate", () => showView(location.hash.slice(1), true));
addEventListener("keydown", (e) => { if (e.key === "Escape") { closeDrawer(); closeModal(); document.body.classList.remove("menu-on"); } });
$("#mMenu").addEventListener("click", () => { document.body.classList.toggle("menu-on"); if (document.body.classList.contains("menu-on") && hasG && !reduce) gsap.fromTo("#mNav a", { yPercent: 100, opacity: 0 }, { yPercent: 0, opacity: 1, stagger: 0.05, duration: 0.8, ease: "expo.out", delay: 0.2 }); });
addEventListener("resize", () => { movePill(); markActive(); });

/* ---------- Ambient: silk lines + orbit + cursor ---------- */
const cv = $("#field"), cx2 = cv.getContext("2d"); let W = 0, H = 0, tick = 0;
function sizeCv() { const d = Math.min(2, devicePixelRatio || 1); W = cv.width = innerWidth * d; H = cv.height = innerHeight * d; cv.style.width = innerWidth + "px"; cv.style.height = innerHeight + "px"; }
sizeCv(); addEventListener("resize", sizeCv);
function drawField() {
  tick += 0.004; cx2.clearRect(0, 0, W, H); const dark = isDark();
  for (let k = 0; k < 14; k++) { cx2.beginPath(); const yb = H * (0.25 + k * 0.045), amp = H * 0.06; for (let x = 0; x <= W; x += 16) { const y = yb + Math.sin(x / W * 4 + tick * 3 + k * 0.4) * amp * Math.sin(tick + k * 0.2) + Math.cos(x / W * 7 - tick * 2) * amp * 0.3; x ? cx2.lineTo(x, y) : cx2.moveTo(x, y); } cx2.strokeStyle = k % 3 === 0 ? (dark ? "rgba(46,230,208,.14)" : "rgba(10,156,150,.16)") : (dark ? "rgba(120,150,255,.07)" : "rgba(11,42,107,.07)"); cx2.lineWidth = (k % 3 === 0 ? 1.4 : 1) * (W / innerWidth); cx2.stroke(); }
  if (!reduce) requestAnimationFrame(drawField);
}
drawField();
let oa = 0, ov = 0.003, oHover = false;
(function orbitLoop() {
  if (current === "inicio") { const chips = $$("#orbit .chip"), wrap = $("#orbitWrap"); if (wrap && chips.length) { const rx = wrap.offsetWidth * 0.46, ry = wrap.offsetHeight * 0.17; if (!oHover) oa += ov; chips.forEach((c, i) => { const a = oa + (i / chips.length) * Math.PI * 2, z = Math.sin(a); c.style.transform = `translate(-50%,-50%) translate(${Math.cos(a) * rx}px, ${z * ry}px) scale(${0.72 + (z + 1) * 0.2})`; c.style.zIndex = z > 0 ? 3 : 1; c.style.opacity = 0.45 + (z + 1) * 0.28; }); } }
  requestAnimationFrame(orbitLoop);
})();
$("#orbit").addEventListener("mouseenter", () => (oHover = true)); $("#orbit").addEventListener("mouseleave", () => (oHover = false));
if (!reduce && matchMedia("(hover:hover) and (pointer:fine)").matches) {
  document.body.classList.add("has-cursor");
  const c = $(".cursor"); let mx = innerWidth / 2, my = innerHeight / 2, px = mx, py = my;
  addEventListener("mousemove", (e) => {
    mx = e.clientX; my = e.clientY;
    const m = e.target.closest(".mag"); if (m) { const r = m.getBoundingClientRect(); m.style.transform = `translate(${(mx - r.left - r.width / 2) * 0.2}px,${(my - r.top - r.height / 2) * 0.3}px)`; }
    const tl = e.target.closest("[data-tilt]"); if (tl) { const r = tl.getBoundingClientRect(), x = (mx - r.left) / r.width, y = (my - r.top) / r.height; tl.style.setProperty("--mx", x * 100 + "%"); tl.style.setProperty("--my", y * 100 + "%"); tl.style.transform = `perspective(1000px) rotateY(${(x - 0.5) * 7}deg) rotateX(${(0.5 - y) * 7}deg)`; }
    if (current === "inicio") { const s = $("#starBig"); if (s) s.style.transform = `rotateY(${(mx / innerWidth - 0.5) * 30}deg) rotateX(${(0.5 - my / innerHeight) * 20}deg)`; }
    document.documentElement.style.setProperty("--sx", mx + "px"); document.documentElement.style.setProperty("--sy", my + "px");
  });
  document.addEventListener("mouseout", (e) => { [".mag", "[data-tilt]"].forEach((s) => { const el = e.target.closest(s); if (el && !el.contains(e.relatedTarget)) { el.style.transition = "transform .7s cubic-bezier(.19,1,.22,1)"; el.style.transform = ""; setTimeout(() => (el.style.transition = ""), 700); } }); });
  document.addEventListener("mouseover", (e) => { const v = e.target.closest("[data-cursor]"), h = e.target.closest("a,button,label,summary,input,select,textarea"); c.classList.toggle("view", !!v); c.querySelector("span").textContent = v ? v.dataset.cursor : ""; c.classList.toggle("hover", !v && !!h); });
  (function loop() { px += (mx - px) * 0.2; py += (my - py) * 0.2; c.style.transform = `translate(${px}px,${py}px)`; requestAnimationFrame(loop); })();
}

/* ---------- Motion ---------- */
let firstPaint = true;
function countUp(el) { const end = +el.dataset.count, s = el.dataset.suffix || ""; if (!hasG || reduce) return; const o = { v: 0 }; gsap.to(o, { v: end, duration: 2, ease: "power3.out", onUpdate: () => (el.textContent = Math.round(o.v) + s) }); }
const charIn = (els, extra = {}) => gsap.from(els, { yPercent: 120, rotateX: -80, opacity: 0, transformOrigin: "50% 100%", stagger: 0.02, duration: 1.1, ease: "expo.out", ...extra });
function buildMotion(entering) {
  if (!hasG || reduce) return;
  ScrollTrigger.getAll().forEach((s) => s.kill());
  const view = $(".view.on"); if (!view) return; const q = (s) => view.querySelectorAll(s), d0 = firstPaint ? 1.9 : 0.5;
  if (entering) { const h = view.querySelector(".vhead h1, .h-title"); if (h) charIn(h.querySelectorAll(".ch"), { delay: d0 }); gsap.from(view.querySelectorAll(".vhead .kick, .vhead .v-lede, .h-in"), { y: 30, opacity: 0, stagger: 0.08, duration: 1.1, ease: "expo.out", delay: d0 + 0.2 }); }
  q(".s-head .chars, .cta-box .chars").forEach((h) => charIn(h.querySelectorAll(".ch"), { scrollTrigger: { trigger: h, start: "top 88%" } }));

  if (view.id === "v-inicio") {
    if (entering) {
      const sa = $$("#starBig .sa, #starBig .sb"); sa.forEach((p) => { const l = p.getTotalLength(); gsap.fromTo(p, { strokeDasharray: l, strokeDashoffset: l }, { strokeDashoffset: 0, duration: 2, ease: "power3.inOut", delay: d0 - 0.3 }); });
      gsap.fromTo("#orbit", { scale: 0.2, opacity: 0, rotate: -40 }, { scale: 1, opacity: 1, rotate: 0, duration: 1.6, ease: "expo.out", delay: d0 + 0.6 });
      gsap.from(".ring", { scale: 0.4, opacity: 0, stagger: 0.15, duration: 1.6, ease: "expo.out", delay: d0 + 0.3 });
      gsap.from("#stats > div", { y: 40, opacity: 0, stagger: 0.08, duration: 1, ease: "expo.out", delay: d0 + 0.6, onStart: () => $$("#stats [data-count]").forEach(countUp) });
    }
    gsap.to("#orbitWrap", { yPercent: -18, ease: "none", scrollTrigger: { trigger: ".hero", start: "top top", end: "bottom top", scrub: true } });
    q(".fc").forEach((f, i) => { gsap.from(f, { y: 120, opacity: 0, rotateX: 18, duration: 1.4, ease: "expo.out", scrollTrigger: { trigger: f, start: "top 88%" } }); gsap.fromTo(f.querySelector(".mock"), { yPercent: 8 }, { yPercent: -8, ease: "none", scrollTrigger: { trigger: f, start: "top bottom", end: "bottom top", scrub: true } }); });
    gsap.from(".why-c", { y: 70, opacity: 0, stagger: 0.1, duration: 1.1, ease: "expo.out", scrollTrigger: { trigger: "#whyGrid", start: "top 85%" } });
    gsap.from(".cta-box", { scale: 0.92, opacity: 0, duration: 1.3, ease: "expo.out", scrollTrigger: { trigger: ".cta-box", start: "top 85%" } });
    gsap.fromTo(".cta-star svg", { rotate: -30 }, { rotate: 30, ease: "none", scrollTrigger: { trigger: ".cta-box", start: "top bottom", end: "bottom top", scrub: true } });
  }
  if (view.id === "v-proyectos") { gsap.from("#filters", { y: 20, opacity: 0, duration: 0.9, ease: "expo.out", delay: entering ? d0 + 0.3 : 0 }); gsap.fromTo(".pc", { y: 80, opacity: 0, rotateX: 14 }, { y: 0, opacity: 1, rotateX: 0, stagger: 0.07, duration: 1.1, ease: "expo.out", delay: entering ? d0 + 0.4 : 0, clearProps: "transform" }); requestAnimationFrame(movePill); }
  if (view.id === "v-precios") {
    gsap.fromTo(".pk", { y: 90, opacity: 0, rotateY: -14 }, { y: 0, opacity: 1, rotateY: 0, stagger: 0.1, duration: 1.2, ease: "expo.out", delay: entering ? d0 + 0.35 : 0, clearProps: "transform" });
    gsap.from(".cost", { x: -50, opacity: 0, stagger: 0.08, duration: 1, ease: "expo.out", scrollTrigger: { trigger: "#costList", start: "top 85%" } });
    gsap.from(".cost i", { scaleX: 0, transformOrigin: "left", stagger: 0.08, duration: 1.4, ease: "expo.out", scrollTrigger: { trigger: "#costList", start: "top 80%" } });
    gsap.from(".c-in > *, .c-out", { y: 40, opacity: 0, stagger: 0.06, duration: 1, ease: "expo.out", scrollTrigger: { trigger: "#calcBox", start: "top 85%" } });
    requestAnimationFrame(() => { movePill(); moveInk(".c-term .on", ".c-term .ct-ink"); });
  }
  if (view.id === "v-proceso") {
    gsap.fromTo(".tl-line i", { scaleY: 0 }, { scaleY: 1, ease: "none", scrollTrigger: { trigger: "#timeline", start: "top 70%", end: "bottom 60%", scrub: true } });
    q(".tl-step").forEach((s) => { gsap.from(s.querySelector(".tl-card"), { x: s.classList.contains("l") ? -80 : 80, opacity: 0, duration: 1.1, ease: "expo.out", scrollTrigger: { trigger: s, start: "top 85%" } }); gsap.from(s.querySelector(".tl-dot"), { scale: 0, duration: 0.8, ease: "back.out(3)", scrollTrigger: { trigger: s, start: "top 80%" } }); });
    gsap.from(".qa", { y: 30, opacity: 0, stagger: 0.07, duration: 0.9, ease: "expo.out", scrollTrigger: { trigger: "#faq", start: "top 88%" } });
  }
  if (view.id === "v-contacto") { gsap.from(".cform .fl, .cform .btn", { y: 30, opacity: 0, stagger: 0.06, duration: 0.9, ease: "expo.out", delay: entering ? d0 + 0.3 : 0 }); gsap.from(".cside > *", { x: 40, opacity: 0, stagger: 0.08, duration: 1, ease: "expo.out", delay: entering ? d0 + 0.4 : 0 }); }
  gsap.fromTo("#fGiant span", { yPercent: 100, opacity: 0 }, { yPercent: 0, opacity: 1, stagger: 0.05, ease: "none", scrollTrigger: { trigger: ".foot", start: "top bottom", end: "bottom bottom", scrub: 0.6 } });
  requestAnimationFrame(() => ScrollTrigger.refresh());
}

/* ---------- Boot ---------- */
renderStatic();
showView(location.hash.slice(1), false);
const ld = $("#loader");
if (!hasG || reduce) { ld.style.display = "none"; firstPaint = false; }
else {
  ld.style.animation = "none";
  const ps = $$(".ld-star path"); ps.forEach((p) => { const l = p.getTotalLength(); gsap.set(p, { strokeDasharray: l, strokeDashoffset: l }); });
  gsap.timeline({ onComplete: () => (firstPaint = false) })
    .to(ps, { strokeDashoffset: 0, duration: 1.1, stagger: 0.15, ease: "power3.inOut" })
    .from(".ld-word", { y: 20, opacity: 0, duration: 0.7, ease: "expo.out" }, 0.4)
    .to(".ld-star", { rotate: 72, scale: 0.8, duration: 0.7, ease: "power3.in" }, 1.3)
    .to(ld, { clipPath: "circle(0% at 50% 50%)", duration: 0.9, ease: "expo.inOut" }, 1.5).set(ld, { display: "none" });
}
})();
</script></body></html>
