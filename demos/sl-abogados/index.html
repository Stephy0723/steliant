function isDark(){const a=document.documentElement.dataset.theme;return a?a==="dark":matchMedia("(prefers-color-scheme: dark)").matches}
function paintTheme(){
  $("#themeBtn").innerHTML=ic(isDark()?"sun":"moon");
  const cur=document.documentElement.dataset.theme||"system";
  $$("#themeSeg button").forEach(b=>b.classList.toggle("on",b.dataset.t===cur));
}
function setTheme(t,ev){
  const apply=()=>{if(t==="system"){delete document.documentElement.dataset.theme;store.del("sl-theme")}else{document.documentElement.dataset.theme=t;store.set("sl-theme",t)}paintTheme()};
  if(document.startViewTransition&&!reduce&&ev){
    const x=ev.clientX||innerWidth-40,y=ev.clientY||40,r=Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y));
    const tr=document.startViewTransition(apply);
    tr.ready.then(()=>document.documentElement.animate({clipPath:[`circle(0 at ${x}px ${y}px)`,`circle(${r}px at ${x}px ${y}px)`]},{duration:650,easing:"cubic-bezier(.2,.7,.2,1)",pseudoElement:"::view-transition-new(root)"})).catch(()=>{});
  }else apply();
}
const savedTheme=store.get("sl-theme"); if(savedTheme)document.documentElement.dataset.theme=savedTheme;

/* ================= Router ================= */
let route="", timers=[];
const view=()=>$("#view");
function parse(h){h=(h||"").replace(/^#/,"");if(!h)return"inicio";return h}
function navKey(r){if(r.startsWith("area.")||r.startsWith("srv."))return"areas";if(r.startsWith("inm.")||r==="publicar")return"inmuebles";if(r.startsWith("abg."))return"abogados";if(["honorarios","proceso","despacho","panel","login"].includes(r))return"mas";return r}
function valid(r){if(NAV.some(n=>n[0]===r)||r==="publicar"||r==="panel"||r==="login")return true;if(/^(inm|abg)\.[\w-]+$/.test(r))return true;if(r.startsWith("area."))return!!AREA[r.slice(5)];if(r.startsWith("srv."))return!!SRV[r.slice(4)];return false}
function go(r,push=true){
  if(!valid(r))r="inicio";
  closeDrawer();if(CV.sel)closeSheet();
  if(r===route){window.scrollTo({top:0,behavior:reduce?"auto":"smooth"});return}
  const first=!route;
  timers.forEach(clearInterval);timers=[];
  const bar=$("#routeBar");bar.classList.remove("go");void bar.offsetWidth;bar.classList.add("go");
  const swap=()=>{
    route=r;render();window.scrollTo(0,0);
    view().classList.remove("out");
    $$(".rv",view()).forEach((el,i)=>el.style.setProperty("--i",Math.min(i,12)));
    markNav();showNav();renderFab();
    if(push){try{history.pushState({r},"","#"+r)}catch(e){}}
  };
  if(first||reduce)swap();else{view().classList.add("out");setTimeout(swap,240)}
}
function markNav(){

let fichaK=0;
function startFichas(){
  const box=$("#fichas");if(!box||reduce)return;
  const cards=$$(".ficha",box),N=cards.length;
  const paint=()=>cards.forEach((c,i)=>{const p=(i-fichaK+N)%N;c.dataset.p=p<3?p:"x"});
  fichaK=0;paint();
  let paused=false;box.addEventListener("pointerenter",()=>paused=true);box.addEventListener("pointerleave",()=>paused=false);
  timers.push(setInterval(()=>{if(paused||document.hidden)return;const cur=cards[fichaK%N];cur.dataset.p="out";fichaK=(fichaK+1)%N;setTimeout(paint,420)},4600));
}
function startTyping(){
  const el=$("#typed");if(!el)return;
  const words=["divorcio","herencia","despido","comprar una casa","residencia","constituir empresa","cheque sin fondos","pensión alimentaria"];
  if(reduce){el.textContent=words[0];return}
  let w=0,i=words[0].length,del=true,wait=12;
  timers.push(setInterval(()=>{
    if(wait>0){wait--;return}
    const word=words[w];
    if(del){i--;if(i<=0){del=false;w=(w+1)%words.length}}
    else{i++;if(i>=words[w].length){del=true;wait=22}}
    el.textContent=words[w].slice(0,Math.max(i,0))||" ";
  },70));
}

function shortest(ts){
  const score=t=>{const n=norm(t);const m=n.match(/(\d+)/);let v=m?+m[1]:1;if(n.startsWith("mismo")||n.startsWith("inmediato")||n.startsWith("horas"))return 0;if(n.includes("dia"))return v;if(n.includes("semana"))return v*7;if(n.includes("mes"))return v*30;if(n.includes("ano"))return v*365;return 9999};
  return [...ts].sort((a,b)=>score(a)-score(b))[0].split(" · ")[0];
}

  closeDrawer();

function closePal(){$("#palRoot").innerHTML="";document.body.style.overflow=""}
function palDraw(){
  const q=norm($("#palQ").value.trim());const R=$("#palR");palItems=[];
  if(!q){
    palItems=PAGES.map(p=>p[0]);
    R.innerHTML=`<div class="pal-g">Sugerencias</div><div class="pal-sug">${["divorcio","herencia","despido","marca","residencia","alquiler","cheque","amparo"].map(s=>`<button data-sug="${s}">${s}</button>`).join("")}</div><div class="pal-g">Páginas</div>`+PAGES.map((p,i)=>`<a class="pal-it" href="#${p[0]}" data-i="${i}"><span class="ic">${ic(p[2])}</span><div><b>${p[1]}</b></div></a>`).join("");
    palMark();return;
  }
  const words=q.split(/\s+/);
  const score=(txt,main)=>{const n=norm(txt),m=norm(main);let s=0;for(const w of words){if(m.includes(w))s+=m.startsWith(w)?4:3;else if(n.includes(w))s+=1;else return 0}return s};
  const areas=AREAS.map(a=>({a,s:score(a.n+" "+a.sh+" "+a.d,a.n)})).filter(x=>x.s).sort((x,y)=>y.s-x.s).slice(0,4);
  const srvs=Object.values(SRV).map(s=>({x:s,s:score(s.n+" "+s.d+" "+s.area.n,s.n)})).filter(x=>x.s).sort((x,y)=>y.s-x.s).slice(0,8);

  if(areas.length){h+=`<div class="pal-g">Áreas</div>`+areas.map(({a})=>{palItems.push("area."+a.id);return `<a class="pal-it" href="#area.${a.id}" data-i="${i++}"><span class="ic">${ic(a.ic)}</span><div><b>${esc(a.n)}</b><small>${a.s.length} servicios · ${esc(a.sh)}</small></div></a>`}).join("")}
  if(glos.length){h+=`<div class="pal-g">Glosario</div>`+glos.map(g=>{palItems.push("proceso");return `<a class="pal-it" href="#proceso" data-i="${i++}"><span class="ic">${ic("book")}</span><div><b>${esc(g[0])}</b><small>${esc(g[1])}</small></div></a>`}).join("")}
  R.innerHTML=h||`<div class="pal-empty">No encontramos “${esc($("#palQ").value)}”.<br><a class="link" href="#contacto" style="margin-top:10px">Agende una consulta y le orientamos ${ic("arr")}</a></div>`;
  palMark();
}

async function initData(){

  ST.inViewer=!!(window.claude&&typeof window.claude.use==="function");

  ST.user=user;
  if(!db){ST.ready=true;changed();return}

  subscribeContent();
  try{ST.uid=user?await user.id():null}catch(e){}

  window.claude.use("assets").then(a=>{ST.assets=a;if(route==="publicar")paintPhotos()}).catch(()=>{});
  db.collection("inmuebles").onSnapshot(s=>{ST.inm=s.docs.map(d=>({...d.data(),id:d.id}));changed()},dbErr);
  db.collection("abogados").onSnapshot(s=>{ST.abg=s.docs.map(d=>({...d.data(),id:d.id}));changed()},dbErr);
  db.doc("config/despacho").onSnapshot(s=>{if(s.exists){applyCfg(s.data());changed()}},dbErr);
  if(ST.uid)db.doc("envios/"+ST.uid).onSnapshot(s=>{ST.mine=s.exists?(s.data().items||[]):[];changed()},dbErr);
  if(ST.admin){
    subscribeCrm();
    db.collection("envios").onSnapshot(s=>{const all=[];s.docs.forEach(d=>(d.data().items||[]).forEach(it=>all.push({...it,autor:d.id})));ST.envAll=all;changed()},dbErr);
    db.collection("contactos").onSnapshot(s=>{ST.contactos=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));changed()},dbErr);
    db.collection("citas").onSnapshot(s=>{const all=[];s.docs.forEach(d=>(d.data().items||[]).forEach(it=>all.push({...it,autor:d.id})));ST.citasAll=all;changed()},dbErr);
  }

function writeErr(e){

  throw e;

     .filter(x=>(IF.op==="todos"||x.op===IF.op)&&(!IF.tipo||x.tipo===IF.tipo)&&(!IF.prov||x.provincia===IF.prov)&&(!IF.hab||+x.hab>=+IF.hab)&&(!max||+x.precio<=max)&&(!q||norm([x.titulo,x.sector,x.provincia,x.desc,TIPO[x.tipo]].join(" ")).includes(q)));

function compress(file,max,q){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c)};img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url})}
async function addPhotos(files){
  files=[...files].filter(f=>/^image\//.test(f.type));
  const cap=ST.mode==="db"?8:4;
  for(const f of files){
    if(pf.fotos.length>=cap){toast(`Máximo ${cap} fotos`);break}
    try{
      if(ST.mode==="db"){
        if(!ST.assets){toast("No puede subir fotos con esta cuenta");break}
        pf._up=true;paintPhotos();
        const c=await compress(f,1600,.84);const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.84));
        const r=await ST.assets.upload(blob,{type:"image/jpeg"});pf.fotos.push(r.id);
      }else{const c=await compress(f,900,.7);pf.fotos.push(c.toDataURL("image/jpeg",.7))}
    }catch(e){toast(e&&e.code==="too_large"?"Una foto es demasiado grande":e&&e.code==="quota_or_state"?"No hay espacio para más fotos":"No se pudo cargar una foto")}
    pf._up=false;paintPhotos();
  }
}
function bindPub(){
  const form=$("#pform");

  ["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over")}));
  drop.addEventListener("drop",e=>addPhotos(e.dataTransfer.files));

  form.addEventListener("click",e=>{
    const t=e.target.closest("[data-pop],[data-ptipo],[data-ptit],[data-pex],[data-psrv],[data-step],[data-pdel],[data-pcover],[data-pwa]");if(!t)return;
    if(t.dataset.pop){pf.op=t.dataset.pop;form.dataset.op=pf.op;$$("[data-pop]").forEach(b=>b.classList.toggle("on",b===t))}
    else if(t.dataset.ptipo){pf.tipo=t.dataset.ptipo;$$("[data-ptipo]").forEach(b=>b.classList.toggle("on",b===t))}
    else if(t.dataset.ptit){pf.tituloEstado=t.dataset.ptit;$$("[data-ptit]").forEach(b=>b.classList.toggle("on",b===t))}
    else if(t.dataset.pex){const v=t.dataset.pex;pf.extras=pf.extras.includes(v)?pf.extras.filter(x=>x!==v):[...pf.extras,v];t.classList.toggle("on")}
    else if(t.dataset.psrv){const v=t.dataset.psrv;pf.servicios=pf.servicios.includes(v)?pf.servicios.filter(x=>x!==v):[...pf.servicios,v];t.classList.toggle("on")}
    else if(t.dataset.step){const inp=$("#p-"+t.dataset.step);inp.value=Math.max(0,(+digits(inp.value)||0)+(+t.dataset.d))}

    else if(t.dataset.pcover!==undefined){const i=+t.dataset.pcover;pf.fotos.unshift(pf.fotos.splice(i,1)[0]);paintPhotos()}
    else if(t.hasAttribute("data-pwa")){pfRead();if(!pfValid(true))return;window.open(waLink(pubWaText()),"_blank","noopener")||toast("Abra WhatsApp: "+CONTACT.tel)}
  });
  form.addEventListener("submit",async e=>{
    e.preventDefault();pfRead();if(!pfValid())return;if(pf._up){toast("Espere a que terminen de subir las fotos");return}
    const btn=$("#psub");btn.disabled=true;btn.textContent="Guardando…";
    const now=new Date().toISOString();
    const item={id:pf.id,op:pf.op,tipo:pf.tipo,titulo:pf.titulo||`${TIPO[pf.tipo]} en ${pf.sector}`,provincia:pf.provincia,sector:pf.sector,precio:+pf.precio||0,moneda:pf.moneda,mant:+pf.mant||0,deposito:pf.op==="alquiler"?+pf.deposito:0,m2c:+pf.m2c||0,m2s:+pf.m2s||0,hab:+pf.hab||0,banos:+pf.banos||0,parq:+pf.parq||0,amueblado:!!pf.amueblado,extras:pf.extras,desc:pf.desc,tituloEstado:pf.tituloEstado,fotos:pf.fotos,servicios:pf.servicios,
      contacto:{nombre:pf.nombre,tel:pf.tel,email:pf.email,rol:pf.rol},creado:pf._edit?(pf.creado||now):now,actualizado:now};
    try{
      if(ST.admin){
        const prev=inmById(item.id);
        await putInm({...item,estado:prev?prev.estado:"publicado",verificado:prev?!!prev.verificado:false,autor:prev?prev.autor||"":pf._autor||""});
        if(pf._autor&&pf._autor!==uidLocal)await patchEnvio(pf._autor,item.id,{estado:"publicado"});
        toast(pf._edit?"Cambios guardados":"Publicado en el catálogo");const id=item.id;pf=null;go("inm."+id);
      }else{
        if(ST.mode==="db"&&!ST.uid){toast("Inicie sesión para publicar, o envíelo por WhatsApp");btn.disabled=false;btn.textContent="Enviar para revisión";return}
        const items=ST.mine.filter(x=>x.id!==item.id);items.push({...item,estado:"pendiente"});await saveMine(items);
        pf=null;showPubDone(item);
      }
    }catch(err){btn.disabled=false;btn.textContent=ST.admin?"Publicar en el catálogo":"Enviar para revisión"}
  });
}

/* ---------- Contenido dinámico ---------- */
function mergedAreas(){
  const out=DEF_AREAS.map((a,i)=>DBAREAS[a.id]?{...clone(DBAREAS[a.id]),_mod:true}:{...clone(a),orden:i});
  Object.values(DBAREAS).forEach(d=>{if(!DEF_AREAS.some(a=>a.id===d.id))out.push({...clone(d),_nueva:true})});
  return out.filter(a=>!a.eliminada).sort((a,b)=>(a.orden??99)-(b.orden??99));
}
function rebuildIndex(){
  ALLAREAS=mergedAreas();
  AREAS.length=0;
  ALLAREAS.filter(a=>!a.oculta).forEach(a=>{const c={...a,s:(a.s||[]).filter(s=>!s.oculto).map(s=>({...s}))};delete c._mod;delete c._nueva;AREAS.push(c)});
  Object.keys(SRV).forEach(k=>delete SRV[k]);Object.keys(AREA).forEach(k=>delete AREA[k]);TOTAL=0;
  AREAS.forEach(a=>{AREA[a.id]=a;a.s.forEach(s=>{s.area=a;SRV[s.id]=s;TOTAL++})});
}
function applyList(target,src){target.length=0;src.forEach(x=>target.push(x))}
function applyContenido(m){
  applyList(FAQ,m.faq&&Array.isArray(m.faq.items)?m.faq.items.map(x=>[x.q,x.a]):DEF_FAQ);
  applyList(GLOSARIO,m.glosario&&Array.isArray(m.glosario.items)?m.glosario.items.map(x=>[x.t,x.d]):DEF_GLOS);
  Object.keys(TEXTOS).forEach(k=>TEXTOS[k]=DEF_TEXTOS[k]);Object.assign(TEXTOS,(m.textos&&m.textos.t)||{});
}
function contentChanged(){rebuildIndex();paintDrAreas();changed()}
function subscribeContent(){
  ST.db.collection("areas").onSnapshot(s=>{DBAREAS={};s.docs.forEach(d=>DBAREAS[d.id]={...d.data(),id:d.id});contentChanged()},dbErr);
  ST.db.collection("contenido").onSnapshot(s=>{applyContenido(Object.fromEntries(s.docs.map(d=>[d.id,d.data()])));contentChanged()},dbErr);
}

const keyOf=(tel,email)=>{const d=digits(tel).slice(-10);return d.length>=7?"t"+d:(email?"e"+String(email).toLowerCase().trim():"")};
function webLeads(){
  const L=[];
  ST.citasAll.forEach(c=>L.push({tipo:"cita",key:keyOf(c.phone,c.email),nombre:c.name,tel:c.phone,email:c.email,area:c.area&&c.area!=="general"?c.area:"",srv:c.srv||"",abg:c.abg||"",fecha:c.at||c.date,ref:c}));
  ST.envAll.forEach(x=>{const co=x.contacto||{};L.push({tipo:"inmueble",key:keyOf(co.tel,co.email),nombre:co.nombre,tel:co.tel,email:co.email,area:"inmobiliario",srv:x.op==="venta"?"compraventa":"alquiler",abg:"",fecha:x.creado,ref:x})});
  return L.filter(l=>l.key);
}
function clientes(){
  const real=CRM.map(c=>({...c,hist:[]}));const by={};
  real.forEach(c=>{const k=keyOf(c.tel,c.email);if(k)by[k]=c});
  const virt={};
  webLeads().forEach(l=>{const c=by[l.key];if(c){c.hist.push(l);return}
    if(!virt[l.key])virt[l.key]={id:"v-"+l.key,virtual:true,nombre:l.nombre||"Sin nombre",tel:l.tel||"",email:l.email||"",origen:l.tipo==="cita"?"web-cita":"web-inmueble",etapa:"nuevo",area:l.area,srv:l.srv,abg:l.abg,valor:0,notas:[],creado:l.fecha,hist:[]};
    virt[l.key].hist.push(l)});

}

  const cart=C.filter(c=>["propuesta","activo"].includes(c.etapa)).reduce((s,c)=>s+(+c.valor||0),0);
  const seg=C.filter(c=>c.proxima&&!["cerrado","perdido"].includes(c.etapa)).sort((a,b)=>a.proxima.localeCompare(b.proxima)).slice(0,6);
  const tot=C.length||1;

  act2.sort((a,b)=>String(b.t||"").localeCompare(String(a.t||"")));

   <button class="kpi" data-mod="clientes" data-fet="nuevo"><small>Leads nuevos</small><b>${nuevos}</b><span>Por contactar</span></button>
   <button class="kpi" data-mod="clientes" data-fet="activo"><small>Clientes activos</small><b>${act}</b><span>Casos en curso</span></button>
   <button class="kpi" data-mod="citas"><small>Citas próximas</small><b>${prox.filter(c=>c.date<=in7).length}</b><span>En los próximos 7 días</span></button>

  <div class="two-c">
   <div class="card lst"><h3>${ic("clock")}Seguimientos</h3>${seg.length?seg.map(c=>`<button class="li" data-cli="${esc(c.id)}"><span class="av sm"><i>${esc(initials(c.nombre))}</i></span><div><b>${esc(c.nombre)}</b><small>${esc(c.accion||"Dar seguimiento")}</small></div><span class="${overdue(c)?"late":"when"}">${overdue(c)?"Vencido · ":""}${esc(fdate(c.proxima))}</span></button>`).join(""):`<p class="muted-s">Sin seguimientos programados. Agregue una fecha de próxima acción en la ficha de cada cliente.</p>`}</div>

  </div>

async function moveStage(id,et){
  const c=cliById(id);if(!c||c.etapa===et)return;
  const base=c.virtual?{...c,id:newId("c"),creado:c.creado||new Date().toISOString()}:{...c};
  base.notas=(base.notas||[]).concat([{t:new Date().toISOString(),txt:`Etapa: ${ET[c.etapa]} → ${ET[et]}`,auto:true}]);
  base.etapa=et;
  try{await putCliente(base);toast(`${c.nombre}: ${ET[et]}`);if(CV.sel===id)CV.sel=base.id}catch(e){}

function readCli(){$$("#cliForm [data-c]").forEach(el=>{const k=el.dataset.c;CV.draft[k]=k==="valor"?(+digits(el.value)||0):el.value.trim()})}
async function saveCli(extraNote){
  const c=CV.draft;
  if(!c.nombre){const b=$("#kerr");if(b){b.hidden=false;b.innerHTML=`${ic("alert")}<span>Escriba el nombre del cliente.</span>`}return false}
  const out={...c};delete out.hist;
  if(c.virtual){out.id=newId("c");out.creado=c.creado||new Date().toISOString();if(CV.sel!=="new")out.notas=(out.notas||[]).concat([{t:new Date().toISOString(),txt:"Lead de la web agregado al CRM",auto:true}])}

  delete out.virtual;try{await putCliente(out);CV.sel=out.id;CV.draft={...clone(out),hist:c.hist||[]};toast(extraNote?"Nota agregada":"Ficha guardada");drawSheet();return true}catch(e){return false}

async function doExport(csv){

  if(csv){
    const rows=[["Nombre","Teléfono","Correo","Cédula/RNC","Etapa","Origen","Área","Servicio","Abogado","Honorarios RD$","Próximo seguimiento","Acción","Creado"]].concat(clientes().map(c=>[c.nombre,c.tel,c.email,c.cedula||"",ET[c.etapa]||c.etapa,(ORIGENES.find(o=>o[0]===c.origen)||["",""])[1],(AREA[c.area]||{}).n||"",(SRV[c.srv]||{}).n||"",(lawyerById(c.abg)||{}).nombre||"",+c.valor||"",c.proxima||"",c.accion||"",(c.creado||"").slice(0,10)]));

async function doImport(){
  const d=CV.imp;if(!d)return;
  try{
    if(ST.mode==="db"){
      for(const id of Object.keys(DBAREAS))await ST.db.doc("areas/"+id).delete();
      const defIds=new Set(DEF_AREAS.map(a=>a.id)),incoming=new Set((d.areas||[]).map(a=>a.id));
      for(const [i,a] of (d.areas||[]).entries())await ST.db.doc("areas/"+a.id).set({...a,orden:i});
      for(const id of defIds)if(!incoming.has(id))await ST.db.doc("areas/"+id).set({...clone(DEF_AREAS.find(a=>a.id===id)),eliminada:true});
      if(d.faq)await ST.db.doc("contenido/faq").set({items:d.faq});
      if(d.glosario)await ST.db.doc("contenido/glosario").set({items:d.glosario});
      if(d.textos)await ST.db.doc("contenido/textos").set({t:d.textos});
      if(d.config)await putCfg(d.config);
      for(const l of d.abogados||[])await ST.db.doc("abogados/"+l.id).set(l);
      for(const c of d.crm||[])await ST.db.doc("crm/"+c.id).set(c);
    }else{

   ACCESO DEL EQUIPO — inicio de sesión, roles y usuarios del CRM
   Contraseñas guardadas como hash PBKDF2-SHA256 con sal (nunca en texto).
   ===================================================================== */
const ROLES={admin:["Administrador","Todo el CRM, el contenido de la web y los usuarios"],abogado:["Abogado","Sus clientes, citas e inmuebles"],asistente:["Asistente","Clientes, citas e inmuebles"]};
const ROLE_MODS={admin:null,abogado:["resumen","clientes","citas","inmuebles"],asistente:["resumen","clientes","citas","inmuebles"]};
const AUTH={users:[],ready:false,user:null,fails:0,lockUntil:0,lastAct:Date.now(),setup:false,editU:null,show:false};
const IDLE_MIN=30;
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function hashPass(pass,saltB64){
  const salt=saltB64?unb64(saltB64):crypto.getRandomValues(new Uint8Array(16));
  const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:120000,hash:"SHA-256"},key,256);
  return {salt:b64(salt),hash:b64(bits)};
}
const normU=u=>String(u||"").trim().toLowerCase();
function passScore(p){let s=0;if(p.length>=8)s++;if(p.length>=12)s++;if(/[A-Z]/.test(p)&&/[a-z]/.test(p))s++;if(/\d/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;return Math.min(4,s)}

/* ---------- Sesión ---------- */
function readSess(){let s=null;try{s=JSON.parse(sessionStorage.getItem("sl-sess"))}catch(e){}if(!s)s=store.get("sl-sess");return s}
function writeSess(s,remember){try{sessionStorage.setItem("sl-sess",JSON.stringify(s))}catch(e){}if(remember)store.set("sl-sess",s);else store.del("sl-sess")}
function clearSess(){try{sessionStorage.removeItem("sl-sess")}catch(e){}store.del("sl-sess")}
function checkSession(){
  const s=readSess();
  if(!s){AUTH.user=null;return}
  const u=AUTH.users.find(x=>x.id===s.uid&&x.activo!==false);
  if(!u||(s.exp&&Date.now()>s.exp)||u.ver!==s.ver){AUTH.user=null;if(AUTH.ready)clearSess();return}
  AUTH.user=u;
}
function logout(msg){
  AUTH.user=null;clearSess();if(CV.sel)closeSheet();CV.mod="resumen";
  paintPanelLink();toast(msg||"Sesión cerrada");
  if(route==="panel"||route==="login")softRender();
}
function allowedMods(){const r=AUTH.user&&ROLE_MODS[AUTH.user.rol];return MODS.filter(m=>!r||r.includes(m[0])).concat(AUTH.user&&AUTH.user.rol==="admin"?[["usuarios","Usuarios y acceso","lock"]]:[])}
function canMod(k){return allowedMods().some(m=>m[0]===k)}
function scopeClientes(C){const u=AUTH.user;if(u&&u.rol==="abogado"&&u.abg)return C.filter(c=>c.abg===u.abg||!c.abg);return C}

setInterval(()=>{if(AUTH.user&&Date.now()-AUTH.lastAct>IDLE_MIN*60000)logout(`Sesión cerrada por ${IDLE_MIN} minutos de inactividad`)},30000);

function forgotBox(){
  return `<div class="notes" style="margin-top:4px"><h4>${ic("alert")}Restablecer acceso</h4>${ST.mode==="db"?`<p>Como propietario de la página puede borrar todas las cuentas y crear un administrador nuevo. Los clientes, citas y contenido no se borran.</p><span class="inline-confirm"><button type="button" class="btn sm pri" data-resetusers>Borrar cuentas y empezar</button><button type="button" class="btn sm" data-noforgot>Cancelar</button></span>`:`<p>En modo local, por seguridad, restablecer el acceso también borra los datos del CRM guardados en este navegador (clientes, citas, cambios de contenido).</p><span class="inline-confirm"><button type="button" class="btn sm pri" data-resetlocal>Borrar todo y empezar</button><button type="button" class="btn sm" data-noforgot>Cancelar</button></span>`}</div>`;
}
function bindLogin(){
  const f=$("#authForm");if(!f)return;
  const err=m=>{const b=$("#auErr");b.hidden=false;b.innerHTML=`${ic("alert")}<span>${m}</span>`;f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake")};
  const p1=$("#au-pass");
  if(f.dataset.mode==="setup")p1.addEventListener("input",()=>{const s=passScore(p1.value);$("#pwBar").dataset.s=p1.value?s+1:0;$("#pwTxt").textContent=p1.value?`Seguridad: ${SCORE_TXT[s]}`:"Mínimo 8 caracteres, con letras y números."});
  setTimeout(()=>{const first=$(f.dataset.mode==="setup"?"#au-nombre":"#au-user");first&&first.focus()},350);
  f.addEventListener("submit",async e=>{
    e.preventDefault();
    if(!crypto||!crypto.subtle){err("Este navegador no permite un inicio de sesión seguro. Abra el sitio con https.");return}
    const user=normU($("#au-user").value),pass=$("#au-pass").value,btn=$("#auBtn");
    if(f.dataset.mode==="setup"){
      const nombre=$("#au-nombre").value.trim(),pass2=$("#au-pass2").value;
      if(!nombre||!user)return err("Escriba su nombre y un usuario.");
      if(pass.length<8||!/\d/.test(pass)||!/[a-zA-Z]/.test(pass))return err("La contraseña debe tener al menos 8 caracteres, con letras y números.");
      if(pass!==pass2)return err("Las contraseñas no coinciden.");
      btn.disabled=true;btn.textContent="Creando cuenta…";
      try{const h=await hashPass(pass);const u={id:newId("u"),nombre,usuario:user,rol:"admin",abg:"",activo:true,ver:1,...h,creado:new Date().toISOString(),ultimoAcceso:new Date().toISOString()};
        await putUser(u);AUTH.users=AUTH.users.filter(x=>x.id!==u.id).concat([u]);startSession(u,false);toast("Cuenta creada. Bienvenido");if(route==="panel")softRender();else go("panel")}
      catch(x){btn.disabled=false;btn.textContent="Crear cuenta y entrar";err("No se pudo crear la cuenta. Intente de nuevo.")}
      return;
    }
    if(Date.now()<AUTH.lockUntil)return err("Demasiados intentos. Espere un minuto.");
    if(!user||!pass)return err("Escriba su usuario y contraseña.");
    btn.disabled=true;btn.textContent="Verificando…";
    const u=AUTH.users.find(x=>normU(x.usuario)===user);
    let ok=false;
    try{const h=await hashPass(pass,u?u.salt:b64(new Uint8Array(16)));ok=!!u&&h.hash===u.hash}catch(x){}
    if(ok&&u.activo===false){btn.disabled=false;btn.innerHTML=`Entrar${ic("arr","arr")}`;return err("Esta cuenta está desactivada. Hable con un administrador.")}
    if(!ok){AUTH.fails++;if(AUTH.fails>=5){AUTH.lockUntil=Date.now()+60000;AUTH.fails=0;setTimeout(()=>{if(route==="panel"||route==="login")softRender()},60500);softRender();return}
      btn.disabled=false;btn.innerHTML=`Entrar${ic("arr","arr")}`;return err(`Usuario o contraseña incorrectos.${AUTH.fails>=3?` Le quedan ${5-AUTH.fails} intentos.`:""}`)}
    AUTH.fails=0;startSession(u,$("#au-rem")&&$("#au-rem").checked);
    putUser({...u,ultimoAcceso:new Date().toISOString()}).catch(()=>{});
    toast(`Bienvenido, ${u.nombre.split(" ")[0]}`);
    if(route==="panel")softRender();else go("panel");
  });
}
function startSession(u,remember){AUTH.user=u;AUTH.lastAct=Date.now();writeSess({uid:u.id,ver:u.ver,exp:remember?Date.now()+14*864e5:Date.now()+12*36e5},remember);paintPanelLink()}

function mUsuarios(){
  if(AUTH.editU)return userForm(AUTH.editU);
  return `<div style="margin-bottom:14px"><button class="btn sm pri" data-newuser>${ic("plus")}Agregar usuario</button></div>
   ${AUTH.users.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre)).map(u=>{const l=lawyerById(u.abg);return `<div class="prow ${u.activo===false?"dim":""}"><span class="av sm"><i>${esc(initials(u.nombre))}</i></span><div style="min-width:0"><b>${esc(u.nombre)}${u.id===AUTH.user.id?` <span class="pill ok">Usted</span>`:""}</b><small>${esc(u.usuario)} · ${esc(ROLES[u.rol][0])}${l?" · Perfil: "+esc(l.nombre):""}${u.activo===false?" · Desactivado":""}</small><small>Último acceso: ${u.ultimoAcceso?esc(fdate(u.ultimoAcceso)):"nunca"}</small></div>
    <div class="pact"><button class="btn sm" data-edituser="${esc(u.id)}">${ic("edit")}Editar</button>${u.id===AUTH.user.id?"":confirmDel==="u"+u.id?`<span class="inline-confirm">¿Eliminar? <button class="btn sm pri" data-deluser="${esc(u.id)}">Sí</button><button class="btn sm" data-nodel>No</button></span>`:`<button class="btn sm ghost" data-askdel="u${esc(u.id)}" aria-label="Eliminar">${ic("trash")}</button>`}</div></div>`}).join("")}
   <div class="notes" style="margin-top:18px"><h4>${ic("shield")}Permisos por rol</h4><ul>${Object.values(ROLES).map(r=>`<li><b>${r[0]}:</b> ${r[1]}.</li>`).join("")}<li>Los abogados con perfil vinculado ven solo sus clientes y los que no tienen abogado asignado.</li><li>La sesión se cierra sola tras ${IDLE_MIN} minutos sin actividad.</li></ul></div>`;
}
function userForm(u){
  const isNew=!u.id;
  return `<form class="card aform" id="userForm" novalidate><h3>${isNew?"Nuevo usuario":"Editar usuario"}</h3>
   <div class="two"><div class="fl"><label for="uf-nombre">Nombre completo</label><input id="uf-nombre" value="${esc(u.nombre||"")}"></div><div class="fl"><label for="uf-usuario">Usuario o correo</label><input id="uf-usuario" autocapitalize="none" spellcheck="false" value="${esc(u.usuario||"")}"></div></div>
   <div class="fl"><label>Rol</label><div class="opts s3">${Object.entries(ROLES).map(([k,[l,d]])=>`<button type="button" class="opt big ${u.rol===k?"on":""}" data-urol="${k}"><b>${l}</b><small>${d}</small></button>`).join("")}</div></div>
   <div class="two"><div class="fl"><label for="uf-abg">Perfil de abogado vinculado</label><select class="sel" id="uf-abg"><option value="">Ninguno</option>${lawyers(true).filter(l=>!l.eliminado).map(l=>`<option value="${esc(l.id)}" ${u.abg===l.id?"selected":""}>${esc(l.nombre)}</option>`).join("")}</select></div>
    <div class="fl" style="align-content:end"><label class="chk"><input type="checkbox" id="uf-activo" ${u.activo!==false?"checked":""} ${u.id===AUTH.user.id?"disabled":""}>Cuenta activa</label></div></div>
   <h4>${isNew?"Contraseña":"Cambiar contraseña (opcional)"}</h4>
   <div class="two"><div class="fl"><label for="uf-pass">${isNew?"Contraseña":"Nueva contraseña"}</label><input id="uf-pass" type="password" autocomplete="new-password"></div><div class="fl"><label for="uf-pass2">Repetir</label><input id="uf-pass2" type="password" autocomplete="new-password"></div></div>
   <p class="hint">${isNew?"Comparta la contraseña con la persona por un medio privado. Podrá cambiarla luego.":"Al cambiar la contraseña se cierran las sesiones abiertas de este usuario."}</p>
   <div class="perr" id="ufErr" hidden></div>
   <div class="pbar"><button type="button" class="btn ghost" data-ucancel>Cancelar</button><button type="submit" class="btn pri">Guardar usuario</button></div></form>`;
}
function bindUsers(){
  const f=$("#userForm");if(!f)return;const u=AUTH.editU;
  f.addEventListener("click",e=>{const r=e.target.closest("[data-urol]");if(r){u.rol=r.dataset.urol;$$("[data-urol]",f).forEach(b=>b.classList.toggle("on",b===r))}});
  f.addEventListener("submit",async e=>{
    e.preventDefault();
    const err=m=>{const b=$("#ufErr");b.hidden=false;b.innerHTML=`${ic("alert")}<span>${m}</span>`};
    const nombre=$("#uf-nombre").value.trim(),usuario=normU($("#uf-usuario").value),p=$("#uf-pass").value,p2=$("#uf-pass2").value;
    if(!nombre||!usuario)return err("Escriba el nombre y el usuario.");
    if(AUTH.users.some(x=>x.id!==u.id&&normU(x.usuario)===usuario))return err("Ese usuario ya existe.");
    if(!u.id&&!p)return err("Escriba una contraseña para el usuario nuevo.");
    if(p&&(p.length<8||!/\d/.test(p)||!/[a-zA-Z]/.test(p)))return err("La contraseña debe tener al menos 8 caracteres, con letras y números.");
    if(p!==p2)return err("Las contraseñas no coinciden.");
    if(u.id===AUTH.user.id&&u.rol!=="admin"&&AUTH.users.filter(x=>x.rol==="admin"&&x.activo!==false).length<2)return err("Debe quedar al menos un administrador activo.");
    const out={...u,nombre,usuario,abg:$("#uf-abg").value,activo:u.id===AUTH.user.id?true:$("#uf-activo").checked};
    if(!out.id){out.id=newId("u");out.creado=new Date().toISOString();out.ver=1}
    if(p){Object.assign(out,await hashPass(p));out.ver=(+out.ver||1)+(u.id?1:0)}
    try{await putUser(out);if(out.id===AUTH.user.id){AUTH.user=out;writeSess({...readSess(),ver:out.ver},!!store.get("sl-sess"))}AUTH.editU=null;toast("Usuario guardado");softRender()}catch(x){}
  });
}
async function resetUsers(local){
  try{
    if(local){["sl-users","sl-crm","sl-citas","sl-areas","sl-contenido","sl-env","sl-inm","sl-abg","sl-cfg","sl-cita"].forEach(k=>store.del(k));clearSess();location.reload();return}
    for(const u of AUTH.users)await ST.db.doc("usuarios/"+u.id).delete();
    AUTH.users=[];AUTH.forgot=false;clearSess();toast("Cuentas borradas. Cree un administrador nuevo");softRender();
  }catch(e){toast("No se pudo restablecer el acceso")}
}
function authClick(e){
  const t=e.target;
  if(t.closest("[data-logout]")){logout();return true}
  if(t.closest("[data-showpw]")){const i=$("#au-pass");AUTH.show=i.type==="password";i.type=AUTH.show?"text":"password";t.closest("[data-showpw]").innerHTML=ic(AUTH.show?"lock":"eye");i.focus();return true}
  if(t.closest("[data-forgot]")){AUTH.forgot=true;softRender();return true}
  if(t.closest("[data-noforgot]")){AUTH.forgot=false;softRender();return true}
  if(t.closest("[data-resetusers]")){resetUsers(false);return true}
  if(t.closest("[data-resetlocal]")){resetUsers(true);return true}
  if(t.closest("[data-newuser]")){AUTH.editU={nombre:"",usuario:"",rol:"asistente",abg:"",activo:true};softRender();return true}
  const eu=t.closest("[data-edituser]");if(eu){AUTH.editU=JSON.parse(JSON.stringify(AUTH.users.find(x=>x.id===eu.dataset.edituser)));softRender();return true}
  if(t.closest("[data-ucancel]")){AUTH.editU=null;softRender();return true}
  const du=t.closest("[data-deluser]");if(du){delUser(du.dataset.deluser).then(()=>{confirmDel="";toast("Usuario eliminado");softRender()}).catch(()=>{});return true}
  return false;
}
