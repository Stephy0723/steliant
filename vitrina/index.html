<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vitrina · Catálogo</title>
<meta name="description" content="Vitrina — catálogo con precios y stock en vivo, y panel del vendedor.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f2ee;--bg2:#e9e7e1;--paper:#fff;--ink:#121214;--ink2:#4b4b53;--mut:#8a8a93;--line:rgba(18,18,20,.1);--line2:rgba(18,18,20,.05);--acc:#3346ff;--acc-ink:#fff;--acc-soft:rgba(51,70,255,.1);--lime:#d4ff5a;--ok:#14a065;--low:#e48a1c;--out:#e5484d;--glass:rgba(255,255,255,.72);--sh:0 24px 60px -24px rgba(20,20,40,.25);--sh2:0 6px 20px -8px rgba(20,20,40,.18);
  --f-d:"Instrument Serif",Georgia,serif;--f-b:"Geist",system-ui,sans-serif;--f-m:"Geist Mono",ui-monospace,monospace;--ease:cubic-bezier(.65,0,.15,1);--pad:clamp(16px,4vw,56px);--r:18px;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0c0f;--bg2:#121318;--paper:#16171d;--ink:#f1f1f3;--ink2:#b4b4bd;--mut:#7c7c87;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.045);--acc:#6f7dff;--acc-ink:#fff;--acc-soft:rgba(111,125,255,.14);--glass:rgba(22,23,29,.72);--sh:0 24px 60px -24px rgba(0,0,0,.7);--sh2:0 6px 20px -8px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0c0f;--bg2:#121318;--paper:#16171d;--ink:#f1f1f3;--ink2:#b4b4bd;--mut:#7c7c87;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.045);--acc:#6f7dff;--acc-ink:#fff;--acc-soft:rgba(111,125,255,.14);--glass:rgba(22,23,29,.72);--sh:0 24px 60px -24px rgba(0,0,0,.7);--sh2:0 6px 20px -8px rgba(0,0,0,.6);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background .5s,color .5s}
img{display:block;max-width:100%}
img.broken{opacity:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
::selection{background:var(--acc);color:#fff}
svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:var(--f-m);font-size:11px;letter-spacing:.06em}
.mut{color:var(--mut)}
.wrap{width:100%;max-width:1400px;margin:0 auto;padding:0 var(--pad)}
[data-img]{background:var(--bg2);overflow:hidden}
[data-img] img{width:100%;height:100%;object-fit:cover}
.view{display:none}.view.on{display:block}

/* loader */
#loader{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.ld-cards{position:relative;width:90px;height:110px}
.ld-cards i{position:absolute;inset:0;border-radius:14px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--sh2);animation:deal 1.4s var(--ease) infinite}
.ld-cards i:nth-child(1){background:var(--acc);animation-delay:.2s}.ld-cards i:nth-child(2){background:var(--lime);animation-delay:.1s}
@keyframes deal{0%,100%{transform:rotate(0)}50%{transform:rotate(var(--r,10deg)) translateX(var(--x,20px))}}
.ld-cards i:nth-child(1){--r:-14deg;--x:-26px}.ld-cards i:nth-child(2){--r:12deg;--x:26px}
.ld-word{font-family:var(--f-d);font-size:46px;font-weight:400;font-style:italic}
#loader.out{transition:opacity .6s,visibility .6s;opacity:0;visibility:hidden}
body.no-g #loader{display:none}

/* tiles transition */
.tiles{position:fixed;inset:0;z-index:200;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(5,1fr);pointer-events:none}
.tiles i{background:var(--ink);transform:scale(0);border-radius:30%}
.tiles.busy{pointer-events:all}

/* header */
.bar{position:fixed;top:12px;left:12px;right:12px;z-index:80;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:8px 10px 8px 18px;border-radius:22px;transition:background .4s,box-shadow .4s,transform .5s var(--ease)}
.bar.solid{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:var(--sh2);border:1px solid var(--line)}
.bar.hide{transform:translateY(-130%)}
.logo{display:inline-flex;align-items:center;gap:10px}
.logo b{font-family:var(--f-d);font-weight:400;font-size:26px;font-style:italic;letter-spacing:-.01em}
.lg-mark{position:relative;width:26px;height:26px}
.lg-mark i{position:absolute;width:16px;height:20px;border-radius:5px;top:3px}
.lg-mark i:first-child{left:0;background:var(--acc);transform:rotate(-10deg)}
.lg-mark i:last-child{right:0;background:var(--lime);transform:rotate(10deg);mix-blend-mode:multiply}
:root[data-theme="dark"] .lg-mark i:last-child{mix-blend-mode:screen}
.logo:hover .lg-mark i:first-child{transform:rotate(-20deg) translateX(-2px)}.logo:hover .lg-mark i:last-child{transform:rotate(20deg) translateX(2px)}
.lg-mark i{transition:transform .5s var(--ease)}
.pill{position:relative;display:flex;gap:2px;padding:4px;border-radius:40px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--sh2)}
.pill a{position:relative;z-index:1;height:36px;padding:0 16px;border-radius:30px;display:flex;align-items:center;font-size:13.5px;font-weight:500;color:var(--ink2);transition:color .35s;white-space:nowrap}
.pill a.on{color:var(--bg)}
.pill-ind{position:absolute;z-index:0;top:4px;left:0;height:36px;border-radius:30px;background:var(--ink);transition:transform .55s var(--ease),width .55s var(--ease)}
.bar-r{display:flex;align-items:center;gap:6px;justify-self:end}
.ib{position:relative;height:40px;min-width:40px;padding:0 10px;border-radius:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--paper);transition:border-color .3s,transform .3s}
.ib:hover{border-color:var(--ink)}
.ib svg{width:18px;height:18px}
.ib kbd{font-size:10px;padding:2px 6px;border-radius:6px;background:var(--bg2);color:var(--mut)}
.srch{padding:0 8px 0 12px;min-width:200px;justify-content:flex-start;color:var(--mut)}
.srch .srch-t{flex:1;text-align:left;font-size:13px}
.lang{font-family:var(--f-m);font-size:11px}
.i-sun{display:none}:root[data-theme="dark"] .i-sun{display:block}:root[data-theme="dark"] .i-moon{display:none}
.badge{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--acc);color:#fff;font-style:normal;font-size:11px;font-weight:600;display:grid;place-items:center;transform:scale(0);transition:transform .4s var(--ease)}
.badge.on{transform:scale(1)}
.badge.bump{animation:bump .5s var(--ease)}
@keyframes bump{50%{transform:scale(1.5)}}

/* buttons */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;height:50px;padding:0 24px;border-radius:16px;font-weight:600;font-size:14px;overflow:hidden;isolation:isolate;transition:transform .3s var(--ease),color .4s,background .4s,border-color .4s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn .arr{font-style:normal;transition:transform .4s var(--ease)}
.btn:hover .arr{transform:translateX(4px)}
.btn::after{content:"";position:absolute;inset:0;z-index:-1;background:var(--lime);transform:translateY(101%);transition:transform .5s var(--ease)}
.btn:hover::after{transform:none}
.btn-acc{background:var(--acc);color:var(--acc-ink)}
.btn-acc:hover{color:#121214}
.btn-ink{background:var(--ink);color:var(--bg)}
.btn-ink:hover{color:#121214}
.btn-line{border:1px solid var(--line);background:var(--paper)}
.btn-line:hover{color:#121214;border-color:var(--lime)}
.btn-sm{height:40px;padding:0 14px;border-radius:14px;font-size:13px}
.btn-sm svg{width:16px;height:16px}
.btn[disabled]{opacity:.4;pointer-events:none}

/* type */
.h1{font-family:var(--f-d);font-weight:400;font-size:clamp(46px,7.4vw,112px);line-height:.95;letter-spacing:-.025em}
.h2{font-family:var(--f-d);font-weight:400;font-size:clamp(36px,4.6vw,68px);line-height:1;letter-spacing:-.02em}
.split .ln{display:block;overflow:hidden;padding-bottom:.08em}
.split .ln:nth-child(2){font-style:italic;color:var(--acc)}
.split .w{display:inline-block;will-change:transform}
.kick{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);padding:6px 12px;border:1px solid var(--line);border-radius:30px;margin-bottom:20px;background:var(--paper)}
.lede{font-size:clamp(15px,1.2vw,18px);color:var(--ink2);max-width:520px}
.sec{padding-top:clamp(80px,9vw,140px)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:36px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:4vw;align-items:center;min-height:100svh;padding-top:110px;padding-bottom:40px}
.hero .lede{margin:24px 0 30px}
.ctas{display:flex;gap:10px;flex-wrap:wrap}
.livebox{display:flex;align-items:center;gap:18px;margin-top:40px;padding:14px 18px;border-radius:18px;background:var(--paper);border:1px solid var(--line);width:max-content;max-width:100%;box-shadow:var(--sh2)}
.livebox .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(20,160,101,.5);animation:live 1.8s infinite}
@keyframes live{70%{box-shadow:0 0 0 10px rgba(20,160,101,0)}}
.livebox b{font-family:var(--f-d);font-size:30px;font-weight:400;line-height:1}
.livebox span{font-size:12px;color:var(--mut)}
.livebox .sep{width:1px;height:30px;background:var(--line)}
.hero-stage{position:relative;height:min(78vh,700px);perspective:1200px}
.hc{position:absolute;border-radius:24px;overflow:hidden;background:var(--paper);box-shadow:var(--sh);border:1px solid var(--line);will-change:transform;transition:box-shadow .4s}
.hc img{width:100%;height:100%;object-fit:cover}
.hc.big{left:10%;top:6%;width:56%;height:74%}
.hc.s1{right:0;top:0;width:36%;height:42%}
.hc.s2{right:4%;bottom:4%;width:40%;height:46%}
.hc.s3{left:0;bottom:0;width:30%;height:30%}
.tagc{position:absolute;z-index:3;display:flex;align-items:center;gap:10px;padding:10px 12px 10px 10px;border-radius:16px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:var(--sh2);font-size:12.5px;white-space:nowrap;cursor:pointer}
.tagc img{width:38px;height:38px;border-radius:10px;object-fit:cover;background:var(--bg2)}
.tagc b{display:block;font-size:13px}
.tagc em{font-style:normal;font-family:var(--f-m);font-size:10.5px}
.tagc.t1{left:2%;top:40%}.tagc.t2{right:6%;top:46%}.tagc.t3{left:38%;bottom:-2%}

/* stock chip */
.sc{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-m);font-size:10.5px;letter-spacing:.04em;padding:4px 8px;border-radius:20px;white-space:nowrap}
.sc::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.sc.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.sc.low{color:var(--low);background:color-mix(in srgb,var(--low) 14%,transparent)}
.sc.out{color:var(--out);background:color-mix(in srgb,var(--out) 12%,transparent)}
.sbar{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.sbar i{display:block;height:100%;border-radius:4px;background:var(--ok);width:var(--w,50%);transition:width 1s var(--ease)}
.sbar.low i{background:var(--low)}.sbar.out i{background:var(--out)}

/* mine card */
.mine{padding-top:20px}
.mc{display:grid;grid-template-columns:auto 1fr auto;gap:24px;align-items:center;padding:20px 24px;border-radius:24px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--sh);position:relative;overflow:hidden}
.mc::before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:linear-gradient(var(--acc),var(--lime))}
.mc-imgs{display:flex}
.mc-imgs img{width:56px;height:56px;border-radius:14px;object-fit:cover;border:3px solid var(--paper);margin-left:-16px;background:var(--bg2)}
.mc-imgs img:first-child{margin-left:0}
.mc h4{font-family:var(--f-d);font-weight:400;font-size:28px;line-height:1.1}
.steps{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.steps span{font-family:var(--f-m);font-size:10px;padding:5px 9px;border-radius:20px;background:var(--bg2);color:var(--mut)}
.steps span.on{background:var(--acc);color:#fff}
.mc-r{text-align:right}
.mc-r b{display:block;font-family:var(--f-d);font-size:30px;font-weight:400}
.pulse{animation:pulse 1.4s var(--ease) 2}
@keyframes pulse{50%{box-shadow:0 0 0 8px var(--acc-soft)}}

/* categories */
.cats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.cat{position:relative;aspect-ratio:3/4;border-radius:var(--r);overflow:hidden;background:var(--bg2);display:block;isolation:isolate}
.cat img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.cat:hover img{transform:scale(1.08)}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.65))}
.cat span{position:absolute;left:14px;bottom:12px;right:14px;z-index:2;color:#fff;display:flex;justify-content:space-between;align-items:flex-end}
.cat b{font-family:var(--f-d);font-weight:400;font-size:28px;line-height:1}
.cat em{font-style:normal;font-family:var(--f-m);font-size:10.5px;opacity:.85}
.cat:nth-child(even){margin-top:36px}

/* product card */
.card{position:relative;display:flex;flex-direction:column;border-radius:var(--r);background:var(--paper);border:1px solid var(--line);overflow:hidden;transition:transform .5s var(--ease),box-shadow .5s,border-color .4s}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh);border-color:transparent}
.c-img{position:relative;aspect-ratio:1/1.08;overflow:hidden;background:var(--bg2);display:block}
.c-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .6s,transform 1.2s var(--ease)}
.c-img img+img{opacity:0}
.card:hover .c-img img+img{opacity:1}
.card:hover .c-img img{transform:scale(1.05)}
.card.is-out .c-img img{filter:grayscale(.85);opacity:.75}
.c-tags{position:absolute;left:10px;top:10px;display:flex;gap:6px;z-index:2}
.tag{font-family:var(--f-m);font-size:10px;padding:4px 8px;border-radius:20px;background:var(--paper);color:var(--ink)}
.tag.new{background:var(--lime);color:#121214}.tag.sale{background:var(--out);color:#fff}
.like{position:absolute;right:10px;top:10px;z-index:3;width:38px;height:38px;border-radius:50%;background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;transition:transform .3s var(--ease)}
.like svg{width:18px;height:18px;transition:fill .3s,stroke .3s}
.like:hover{transform:scale(1.1)}
.like.on svg{fill:var(--out);stroke:var(--out)}
.like.pop{animation:pop .5s var(--ease)}
@keyframes pop{40%{transform:scale(1.35)}}
.c-quick{position:absolute;left:10px;right:10px;bottom:10px;z-index:2;height:38px;border-radius:12px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font-size:12.5px;font-weight:600;transform:translateY(130%);transition:transform .45s var(--ease)}
.card:hover .c-quick{transform:none}
.c-b{padding:14px 14px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.c-cat{font-family:var(--f-m);font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.c-b h3{font-size:15px;font-weight:600;line-height:1.3}
.c-row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.price{font-weight:700;font-size:16px;letter-spacing:-.01em}
.price s{font-weight:400;font-size:12px;color:var(--mut);margin-left:6px}
.c-stock{display:flex;flex-direction:column;gap:6px}
.c-stock small{font-family:var(--f-m);font-size:10px;color:var(--mut)}

/* rail */
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px var(--pad) 20px;scrollbar-width:none;scroll-padding:0 var(--pad)}
.rail::-webkit-scrollbar{display:none}
.rail .card{flex:none;width:clamp(230px,22vw,300px);scroll-snap-align:start}
.arrows{display:flex;gap:6px}

/* low band */
.lowband{display:grid;grid-template-columns:.8fr 1.2fr;gap:4vw;align-items:center;padding:clamp(24px,4vw,48px);border-radius:32px;background:var(--ink);color:var(--bg)}
.lowband .kick{background:transparent;color:inherit;border-color:color-mix(in srgb,var(--bg) 25%,transparent)}
.lowband .split .ln:nth-child(2){color:var(--lime)}
.lb-list{display:flex;flex-direction:column;gap:10px}
.lb-it{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:10px;border-radius:16px;background:color-mix(in srgb,var(--bg) 6%,transparent);transition:background .3s}
.lb-it:hover{background:color-mix(in srgb,var(--bg) 12%,transparent)}
.lb-it img{width:56px;height:56px;border-radius:12px;object-fit:cover}
.lb-it b{font-size:14px;display:block}
.lb-it .sbar{margin-top:8px;background:color-mix(in srgb,var(--bg) 15%,transparent)}
.lb-it .n{font-family:var(--f-d);font-size:30px;line-height:1;text-align:right}
.lb-it .n small{display:block;font-family:var(--f-m);font-size:10px;opacity:.6}

/* how */
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.hw{padding:24px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line);position:relative;overflow:hidden;min-height:200px;display:flex;flex-direction:column;justify-content:space-between}
.hw .n{font-family:var(--f-d);font-size:64px;line-height:.8;color:var(--acc);font-style:italic}
.hw h4{font-size:18px;margin-bottom:6px}
.hw p{color:var(--ink2);font-size:14px}
.hw:hover{border-color:var(--acc)}

/* crm cta */
.crm-cta{display:grid;grid-template-columns:.9fr 1.1fr;gap:4vw;align-items:center;padding:clamp(24px,4vw,48px);border-radius:32px;background:linear-gradient(135deg,var(--acc-soft),transparent 60%),var(--paper);border:1px solid var(--line)}
.crm-cta .lede{margin:18px 0 26px}
.mini-dash{border-radius:20px;background:var(--bg);border:1px solid var(--line);padding:16px;box-shadow:var(--sh);display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.md-k{padding:12px;border-radius:14px;background:var(--paper);border:1px solid var(--line)}
.md-k span{font-size:11px;color:var(--mut)}
.md-k b{display:block;font-size:18px;margin-top:4px}
.md-chart{grid-column:1/-1;height:130px;border-radius:14px;background:var(--paper);border:1px solid var(--line);padding:12px;display:flex;align-items:flex-end;gap:6px}
.md-chart i{flex:1;border-radius:6px 6px 2px 2px;background:var(--acc);opacity:.85;transform-origin:bottom}
.md-chart i:nth-child(3n){background:var(--lime);opacity:1}

/* page head */
.page-head{padding-top:clamp(130px,14vw,190px);padding-bottom:30px}
.page-head .lede{margin-top:18px}

/* shop */
.shop{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;align-items:start;padding-bottom:100px}
.filt{position:sticky;top:90px;display:flex;flex-direction:column;gap:22px;padding:20px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line)}
.f-h{font-family:var(--f-m);font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:10px;display:flex;justify-content:space-between}
.f-cats{display:flex;flex-direction:column;gap:2px}
.f-cat{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:10px;font-size:14px;text-align:left;transition:background .3s}
.f-cat:hover{background:var(--bg2)}
.f-cat.on{background:var(--ink);color:var(--bg)}
.f-cat em{font-style:normal;font-family:var(--f-m);font-size:10.5px;opacity:.6}
.tog{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.sw{position:relative;width:42px;height:24px;border-radius:20px;background:var(--line);transition:background .3s;flex:none}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--paper);box-shadow:var(--sh2);transition:transform .35s var(--ease)}
.sw.on{background:var(--acc)}.sw.on::after{transform:translateX(18px)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--acc) var(--p,100%),var(--line) var(--p,100%));outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--paper);border:2px solid var(--acc);box-shadow:var(--sh2);cursor:grab}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--paper);border:2px solid var(--acc)}
.f-pr{display:flex;justify-content:space-between;font-family:var(--f-m);font-size:11px;color:var(--mut);margin-top:8px}
.shop-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sort{display:flex;gap:4px;flex-wrap:wrap}
.sort button{height:34px;padding:0 12px;border-radius:20px;font-size:12.5px;border:1px solid var(--line);background:var(--paper);transition:all .3s}
.sort button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.empty{grid-column:1/-1;padding:60px 20px;text-align:center;border:1px dashed var(--line);border-radius:var(--r);color:var(--mut)}
.empty .btn{margin-top:16px}
.f-mob{display:none}

/* product detail */
.pd{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:4vw;padding-top:110px;padding-bottom:60px;align-items:start}
.pd-back{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);margin-bottom:16px}
.pd-back:hover{color:var(--acc)}
.gal{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px}
.thumbs{display:flex;flex-direction:column;gap:8px}
.thumbs button{width:72px;height:72px;border-radius:14px;overflow:hidden;border:2px solid transparent;background:var(--bg2);transition:border-color .3s}
.thumbs button.on{border-color:var(--acc)}
.thumbs img{width:100%;height:100%;object-fit:cover}
.main-img{position:relative;aspect-ratio:1/1.05;border-radius:24px;overflow:hidden;background:var(--bg2);cursor:zoom-in}
.main-img img{width:100%;height:100%;object-fit:cover;transition:transform .25s ease-out;transform-origin:var(--zx,50%) var(--zy,50%)}
.main-img.zoom img{transform:scale(1.9)}
.pd-info{position:sticky;top:96px}
.pd-info h1{font-family:var(--f-d);font-weight:400;font-size:clamp(38px,4vw,60px);line-height:1;margin:10px 0 14px}
.pd-price{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
.pd-price b{font-size:30px;letter-spacing:-.02em}
.pd-price s{color:var(--mut)}
.pd-price .tag{align-self:center}
.pd-desc{color:var(--ink2);margin-bottom:22px;max-width:460px}
.pd-box{padding:18px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line);margin-bottom:14px}
.pd-st{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pd-st b{font-family:var(--f-d);font-weight:400;font-size:34px;line-height:1}
.pd-st b small{font-family:var(--f-m);font-size:11px;color:var(--mut);margin-left:6px}
.sizes{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px;margin-top:6px}
.sz{position:relative;padding:8px 0 6px;border-radius:12px;border:1px solid var(--line);text-align:center;transition:all .3s}
.sz b{display:block;font-size:15px}
.sz small{font-family:var(--f-m);font-size:9.5px;color:var(--mut)}
.sz:hover{border-color:var(--ink)}
.sz.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sz.on small{color:inherit;opacity:.7}
.sz.no{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.sz.low small{color:var(--low)}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:14px;height:50px}
.qty button{width:44px;height:100%;font-size:18px}
.qty span{min-width:30px;text-align:center;font-weight:600}
.pd-acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pd-acts .btn{flex:1;min-width:200px}
.pd-ul{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:18px;font-size:13px;color:var(--ink2)}
.pd-ul span::before{content:"✓ ";color:var(--ok)}
.pd-meta{display:flex;gap:16px;font-family:var(--f-m);font-size:11px;color:var(--mut)}
.related{padding-bottom:100px}
.related .grid{grid-template-columns:repeat(4,minmax(0,1fr))}

/* selection */
.sel{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start;padding-bottom:100px}
.sel-list{display:flex;flex-direction:column;gap:10px}
.si-row{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line)}
.si-row img{width:96px;height:96px;border-radius:14px;object-fit:cover;background:var(--bg2)}
.si-row h4{font-size:15px}
.si-row .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:var(--mut)}
.si-r{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.si-r .qty{height:38px}
.si-r .qty button{width:34px}
.rm{font-size:12px;color:var(--mut);text-decoration:underline}
.rm:hover{color:var(--out)}
.sel-sum{position:sticky;top:96px;padding:22px;border-radius:24px;background:var(--ink);color:var(--bg)}
.sel-sum .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid color-mix(in srgb,var(--bg) 14%,transparent);font-size:14px}
.sel-sum .tot{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 18px}
.sel-sum .tot b{font-family:var(--f-d);font-size:40px;font-weight:400}
.sel-sum .btn{width:100%}
.sel-sum p{font-size:12px;opacity:.65;margin-top:12px}
.sel-empty{grid-column:1/-1;padding:70px 20px;text-align:center;border-radius:24px;border:1px dashed var(--line)}
.sel-empty svg{width:56px;height:56px;color:var(--acc);margin-bottom:14px}
.sel-empty p{color:var(--ink2);margin-bottom:18px}

/* store */
.store{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;padding-bottom:100px;align-items:start}
.store-img{aspect-ratio:4/3.4;border-radius:28px}
.si{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.faq{margin-top:22px;display:flex;flex-direction:column;gap:8px}
.fq{border-radius:16px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.fq button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px 18px;font-weight:600;text-align:left;gap:10px}
.fq button i{font-style:normal;transition:transform .4s var(--ease)}
.fq.open button i{transform:rotate(45deg)}
.fq p{max-height:0;overflow:hidden;padding:0 18px;color:var(--ink2);transition:max-height .5s var(--ease),padding .5s}
.fq.open p{max-height:200px;padding:0 18px 16px}

/* footer */
.foot{border-top:1px solid var(--line);padding:50px 0 100px;margin-top:40px}
.ft{display:grid;grid-template-columns:1fr auto;gap:24px}
.ft p{margin-top:8px}
.ft-nav{display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center}
.ft-nav a{font-size:14px;color:var(--ink2)}.ft-nav a:hover{color:var(--acc)}
.ft-b{grid-column:1/-1;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:20px;border-top:1px solid var(--line)}

/* fab */
.fab{position:fixed;right:20px;bottom:20px;z-index:70;display:flex;align-items:center;gap:10px;padding:6px 18px 6px 6px;border-radius:40px;background:var(--ink);color:var(--bg);box-shadow:var(--sh);transition:transform .4s var(--ease)}
.fab[hidden]{display:none}
.fab:hover{transform:translateY(-3px)}
.fab-ic{width:42px;height:42px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;position:relative}
.fab-ic::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--acc);animation:ring 2s infinite}
@keyframes ring{to{transform:scale(1.45);opacity:0}}
.fab-ic svg{width:20px;height:20px;fill:#fff;stroke:#fff}
.fab-t{display:flex;flex-direction:column;line-height:1.2;text-align:left}
.fab-t b{font-size:13px}.fab-t em{font-style:normal;font-family:var(--f-m);font-size:10px;opacity:.7}

/* tabbar (móvil) */
.tabbar{display:none}

/* search */
.search{position:fixed;inset:0;z-index:150;display:flex;justify-content:center;padding:12vh 16px 16px;visibility:hidden}
.search.open{visibility:visible}
.s-back{position:absolute;inset:0;background:rgba(8,8,12,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .4s}
.search.open .s-back{opacity:1}
.s-box{position:relative;width:min(640px,100%);max-height:70vh;display:flex;flex-direction:column;border-radius:24px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden;transform:translateY(-20px) scale(.97);opacity:0;transition:transform .45s var(--ease),opacity .35s}
.search.open .s-box{transform:none;opacity:1}
.s-in{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.s-in svg{width:20px;height:20px;color:var(--mut)}
.s-in input{flex:1;border:0;background:none;outline:none;font-size:17px}
.s-res{overflow-y:auto;padding:8px}
.s-it{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:8px;border-radius:14px;transition:background .2s}
.s-it:hover,.s-it.on{background:var(--bg2)}
.s-it img{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--bg2)}
.s-it b{font-size:14px;display:block}
.s-it span{font-size:12px;color:var(--mut)}
.s-it mark{background:var(--lime);color:#121214;border-radius:3px}
.s-none{padding:30px;text-align:center;color:var(--mut)}

/* modal */
.modal{position:fixed;inset:0;z-index:140;display:flex;align-items:center;justify-content:center;padding:16px;visibility:hidden}
.modal.open{visibility:visible}
.m-back{position:absolute;inset:0;background:rgba(8,8,12,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;transition:opacity .4s}
.modal.open .m-back{opacity:1}
.m-card{position:relative;width:min(900px,100%);max-height:calc(100svh - 32px);overflow-y:auto;border-radius:28px;background:var(--paper);box-shadow:var(--sh);transform:translateY(30px) scale(.96);opacity:0;transition:transform .5s var(--ease),opacity .35s}
.modal.open .m-card{transform:none;opacity:1}
.m-x{position:absolute;right:14px;top:14px;z-index:5;width:38px;height:38px;border-radius:50%;background:var(--bg2);font-size:18px}
.qv-card{display:grid;grid-template-columns:1fr 1fr}
.qv-img{aspect-ratio:1;background:var(--bg2)}
.qv-img img{width:100%;height:100%;object-fit:cover}
.qv-b{padding:30px;display:flex;flex-direction:column;gap:12px}
.qv-b h3{font-family:var(--f-d);font-weight:400;font-size:38px;line-height:1}
.qv-b .btn{margin-top:auto}
.req-card{width:min(560px,100%);padding:30px}
.req-card h3{font-family:var(--f-d);font-weight:400;font-size:36px;line-height:1.05;margin-bottom:16px;padding-right:40px}
.req-items{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.req-items img{width:46px;height:46px;border-radius:10px;object-fit:cover;background:var(--bg2)}
.via{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:18px}
.via button{padding:12px 6px;border-radius:14px;border:1px solid var(--line);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;transition:all .3s}
.via button svg{width:20px;height:20px}
.via button.on{border-color:var(--acc);background:var(--acc-soft);color:var(--acc)}
.fld{position:relative;margin-bottom:12px}
.fld input,.fld textarea,.fld select{width:100%;padding:22px 14px 8px;border-radius:14px;border:1px solid var(--line);background:var(--bg);outline:none;transition:border-color .3s;resize:vertical}
.fld select{padding:20px 12px 8px}
.fld label{position:absolute;left:15px;top:15px;font-size:14px;color:var(--mut);pointer-events:none;transition:all .3s var(--ease)}
.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--acc)}
.fld input:focus+label,.fld input:not(:placeholder-shown)+label,.fld textarea:focus+label,.fld textarea:not(:placeholder-shown)+label,.fld.static label{top:6px;font-size:10.5px;color:var(--acc);letter-spacing:.03em}
.fld.err input{border-color:var(--out)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.err-t{color:var(--out);font-size:13px;min-height:18px;margin:4px 0 8px}
.req-card .btn{width:100%}
.btn .sp{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;display:none}
.btn.busy .sp{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.demo-n{font-size:11.5px;color:var(--mut);text-align:center;margin-top:10px}
.done{text-align:center}
.done .ok-ic{width:70px;height:70px;margin:6px auto 16px;border-radius:50%;background:var(--acc);display:grid;place-items:center}
.done .ok-ic svg{width:32px;stroke:#fff;stroke-width:2.5;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .7s .2s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done p{color:var(--ink2);margin-bottom:18px}
.ticket{border-radius:20px;border:1px solid var(--line);background:var(--bg);text-align:left;margin-bottom:18px;overflow:hidden}
.tk-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--acc);color:#fff}
.tk-h b{font-family:var(--f-m);letter-spacing:.14em}
.tk-rows{padding:8px 16px}
.tk-rows div{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.tk-rows div:last-child{border:0}
.tk-rows span{color:var(--mut)}
.done .btns{display:flex;gap:8px}
.done .btns .btn{flex:1}

/* drawer */
.drawer{position:fixed;inset:0;z-index:130;visibility:hidden}
.drawer.open{visibility:visible}
.d-back{position:absolute;inset:0;background:rgba(8,8,12,.45);opacity:0;transition:opacity .4s}
.drawer.open .d-back{opacity:1}
.d-in{position:absolute;right:0;top:0;bottom:0;width:min(460px,100%);background:var(--paper);padding:26px;overflow-y:auto;transform:translateX(100%);transition:transform .6s var(--ease)}
.drawer.open .d-in{transform:none}
.d-in h3{font-family:var(--f-d);font-weight:400;font-size:34px;margin:4px 0 16px}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;z-index:400;transform:translate(-50%,24px);padding:12px 18px;border-radius:14px;background:var(--ink);color:var(--bg);font-size:14px;box-shadow:var(--sh);opacity:0;visibility:hidden;pointer-events:none;transition:all .45s var(--ease);max-width:calc(100% - 32px)}
.toast.on{opacity:1;visibility:visible;transform:translate(-50%,0)}

/* ================= CRM ================= */
#crm{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
#crm[hidden]{display:none}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:20px 14px;border-right:1px solid var(--line);background:var(--paper)}
.side .logo{padding:0 8px;flex-wrap:wrap}
.side .logo em{flex-basis:100%;font-style:normal;color:var(--mut);margin-top:-4px;padding-left:36px}
.side-nav{display:flex;flex-direction:column;gap:2px;position:relative}
.sn{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-size:14px;font-weight:500;color:var(--ink2);transition:color .3s,background .3s}
.sn svg{width:18px;height:18px}
.sn:hover{background:var(--bg2)}
.sn.on{color:var(--bg);background:var(--ink)}
.sn em{margin-left:auto;font-style:normal;font-family:var(--f-m);font-size:10.5px;padding:2px 7px;border-radius:10px;background:var(--out);color:#fff}
.sn em.acc{background:var(--acc)}
.side-b{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.side-tools{display:flex;gap:6px}
.side-exit{width:100%}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--bg2)}
.me img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--line)}
.me b{display:block;font-size:13px}.me span{color:var(--mut)}
.crm-top{display:none}
.crm-main{padding:28px clamp(16px,3vw,40px) 80px;min-width:0}
.ch{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.ch h1{font-family:var(--f-d);font-weight:400;font-size:clamp(34px,3.6vw,52px);line-height:1}
.ch p{color:var(--ink2);margin-top:6px}
.ch-r{display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.kpi{padding:18px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line);position:relative;overflow:hidden}
.kpi span{font-size:12.5px;color:var(--mut)}
.kpi b{display:block;font-size:clamp(22px,2.2vw,30px);letter-spacing:-.02em;margin:6px 0 4px;font-variant-numeric:tabular-nums}
.kpi small{font-family:var(--f-m);font-size:10.5px}
.up{color:var(--ok)}.dn{color:var(--out)}
.kpi .spark{position:absolute;right:12px;top:14px;width:70px;height:28px}
.kpi .spark path{stroke:var(--acc);stroke-width:2}
.dash{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:12px}
.panel{padding:18px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line);min-width:0}
.p-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.p-h b{font-size:15px}
.p-h a,.p-h button.lnk{font-size:12.5px;color:var(--acc)}
.chart{width:100%;height:240px;display:block}
.chart .bar{fill:var(--acc);transition:opacity .3s}
.chart .bar:hover{opacity:.7}
.chart .bar.hi{fill:var(--lime)}
.chart text{fill:var(--mut);font-family:var(--f-m);font-size:9px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tip{fill:var(--ink);font-size:10px;font-family:var(--f-b);font-weight:600}
.lst{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line2)}
.li:last-child{border:0}
.li img{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--bg2)}
.li b{font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li span{font-size:12px;color:var(--mut)}
.li .r{text-align:right;font-size:13px;font-weight:600}
.li .rbtn{height:32px;padding:0 10px;border-radius:10px;font-size:12px;font-weight:600;background:var(--acc-soft);color:var(--acc)}
.dash .full{grid-column:1/-1}

/* tables */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tsearch{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;height:42px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:var(--paper)}
.tsearch svg{width:17px;height:17px;color:var(--mut)}
.tsearch input{flex:1;border:0;background:none;outline:none;font-size:14px}
.segs{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--paper);border:1px solid var(--line);flex-wrap:wrap}
.segs button{height:32px;padding:0 12px;border-radius:10px;font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px;transition:all .3s}
.segs button em{font-style:normal;font-family:var(--f-m);font-size:10px;opacity:.6}

.tbl-w{border-radius:var(--r);background:var(--paper);border:1px solid var(--line);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px}
th{text-align:left;font-weight:500;font-size:11.5px;color:var(--mut);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}

.tp{display:flex;align-items:center;gap:12px;min-width:200px}

.stk{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;height:34px;overflow:hidden}

.stk button:hover{background:var(--bg2)}

.stk input::-webkit-outer-spin-button,.stk input::-webkit-inner-spin-button{-webkit-appearance:none}

.os.ship{color:#8b5cf6;background:rgba(139,92,246,.12)}
.os.done{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.cu{display:flex;align-items:center;gap:10px;white-space:nowrap}

/* kanban */
.kan{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px}
.col{border-radius:var(--r);background:var(--paper);border:1px solid var(--line);padding:12px;min-height:400px;transition:background .3s,border-color .3s}
.col.over{background:var(--acc-soft);border-color:var(--acc)}
.col-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:0 4px}
.col-h em{font-style:normal;font-family:var(--f-m);font-size:11px;color:var(--mut)}
.kc{padding:12px;border-radius:14px;background:var(--bg);border:1px solid var(--line);margin-bottom:8px;cursor:grab;transition:transform .3s var(--ease),box-shadow .3s}

.trk{height:4px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}
.trk i{display:block;height:100%;background:var(--acc);border-radius:4px}

/* customers */
.ucards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.uc{padding:18px;border-radius:var(--r);background:var(--paper);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px;transition:border-color .3s,transform .4s var(--ease)}
.uc:hover{border-color:var(--acc);transform:translateY(-3px)}

.uc-h b{display:block}
.uc-h span{font-size:12px;color:var(--mut)}
.uc-h .tag{margin-left:auto;background:var(--lime);color:#121214}
.uc-s{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}

.uc-s span{font-size:10.5px;color:var(--mut)}
.uc-c{font-size:12px;color:var(--mut);display:flex;justify-content:space-between;gap:8px}

/* product form */

.drop svg{width:36px;height:36px;color:var(--acc)}
.drop b{font-size:14px}.drop span{font-size:12px;color:var(--mut)}
.drop img.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop input{display:none}
.pf-thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pft{position:relative;width:64px;height:64px;border-radius:12px;overflow:hidden;border:2px solid transparent;background:var(--bg2)}
.pft.cov{border-color:var(--acc)}
.pft img{width:100%;height:100%;object-fit:cover}
.pft button{position:absolute;right:2px;top:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:1}

.pft .up-bar i{display:block;height:100%;width:0;background:var(--lime);transition:width .6s}
.sz-ed{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;margin-bottom:12px}
.sz-ed label{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;border-radius:12px;border:1px solid var(--line);font-size:12px;color:var(--mut)}
.sz-ed input{width:100%;text-align:center;border:0;background:var(--bg);border-radius:8px;padding:4px;font-weight:600;outline:none}
.pf-acts{display:flex;gap:8px;margin-top:6px}

  return `<div class="ch"><div><h1>${c.title}</h1><p>${A.length} ${es() ? "pedidos" : "orders"} · ${rd(A.reduce((a, o) => a + o.total, 0))}</p></div></div>
  <div class="tools"><label class="tsearch">${ic("search")}<input id="ordQ" placeholder="${c.id} / ${c.cust}" value="${esc(ORD.q)}"></label><div class="segs">${["all", ...OS].map((f) => `<button type="button" data-ordf="${f}" class="${ORD.f === f ? "on" : ""}">${f === "all" ? c.all : c.st[f]}<em>${cnt(f)}</em></button>`).join("")}</div></div>
  <div class="tbl-w"><table><thead><tr><th>${c.id}</th><th>${c.cust}</th><th>${c.date}</th><th>${c.items}</th><th>${c.total}</th><th>${c.pay}</th><th>${c.status}</th></tr></thead><tbody id="ordBody"></tbody></table></div>`;
}
function paintOrders() {
  const q = ORD.q.toLowerCase(); const a = allOrders().filter((o) => (ORD.f === "all" || o.status === ORD.f) && (!q || (o.id + " " + custOf(o.cust).name).toLowerCase().includes(q)));
  $("#ordBody").innerHTML = a.map((o) => { const cu = custOf(o.cust); return `<tr data-order="${o.id}" style="cursor:pointer"><td class="mono"><b>${o.id}</b></td><td><span class="cu">${pic(U(cu.img, 80))}${esc(cu.name)}</span></td><td>${fmtD(o.date, { day: "numeric", month: "short" })} · ${new Date(o.date).toLocaleTimeString(loc(), { hour: "2-digit", minute: "2-digit" })}</td><td><div class="mc-imgs">${o.items.map((i) => byId(i.id)).filter(Boolean).slice(0, 3).map((p) => pic(U(p.imgs[0], 80))).join("")}</div></td><td><b>${rd(o.total)}</b></td><td>${o.pay}</td><td>${os(o.status)}</td></tr>`; }).join("") || `<tr><td colspan="7" class="mut" style="text-align:center;padding:40px">—</td></tr>`;
  $$("#ordBody .mc-imgs img").forEach((im) => { im.style.width = im.style.height = "32px"; im.style.borderRadius = "8px"; im.style.marginLeft = "-8px"; im.style.border = "2px solid var(--paper)"; });
}
function openOrder(id) {
  const o = allOrders().find((x) => x.id === id); if (!o) return; const c = t().crm.ord; const cu = custOf(o.cust); const si = OS.indexOf(o.status);
  openDrawer(`<p class="kick">${c.detail}</p><h3>${o.id}</h3><div class="uc-h" style="margin-bottom:16px">${pic(U(cu.img, 120))}<div><b>${esc(cu.name)}</b><span>${esc(cu.city)} · ${cu.phone || ""}</span></div></div>
    <div class="lst" style="margin-bottom:14px">${o.items.map((it) => { const p = byId(it.id); return p ? `<div class="li">${pic(U(p.imgs[0], 120))}<div><b>${esc(nameOf(p))}</b><span>${it.qty} × ${rd(it.price)}</span></div><span class="r">${rd(it.qty * it.price)}</span></div>` : ""; }).join("")}</div>
    <div class="ticket"><div class="tk-rows"><div><span>${c.total}</span><b>${rd(o.total)}</b></div><div><span>${c.pay}</span><b>${o.pay}</b></div><div><span>${c.carrier}</span><b>${o.carrier}</b></div><div><span>${c.track}</span><b class="mono">${o.track}</b></div></div></div>
    <p class="f-h">${c.status}</p><div class="steps" style="margin-bottom:16px">${OS.map((s, i) => `<span class="${i <= si ? "on" : ""}">${c.st[s]}</span>`).join("")}</div>
    <div class="segs">${OS.map((s) => `<button type="button" data-setst="${o.id}:${s}" class="${o.status === s ? "on" : ""}">${c.st[s]}</button>`).join("")}</div>`);
}
function setStatus(id, s) {
  SHIP_OVR[id] = s; store.set("vt-ship", JSON.stringify(SHIP_OVR));
  const ex = EXTRA_ORDERS.find((o) => o.id === id); if (ex) { ex.status = s; store.set("vt-orders", JSON.stringify(EXTRA_ORDERS)); }
  toast(`${t().crm.ship.moved} “${t().crm.ord.st[s]}”`);
}
/* envíos */
function crmShip() {
  const c = t().crm; const A = allOrders().filter((o) => o.status !== "done" || daysAgo(o.date) < 9).slice(0, 26);
  return `<div class="ch"><div><h1>${c.ship.title}</h1><p>${c.ship.hint}</p></div></div><div class="kan">${OS.map((s, si) => { const L0 = A.filter((o) => o.status === s); return `<div class="col" data-col="${s}"><div class="col-h">${os(s)}<em>${L0.length}</em></div>${L0.map((o) => { const cu = custOf(o.cust); return `<div class="kc" draggable="true" data-kc="${o.id}"><div class="kc-t"><b>${o.id}</b><span>${fmtD(o.date, { day: "numeric", month: "short" })}</span></div><b style="font-size:13.5px">${esc(cu.name)}</b><div class="imgs">${o.items.map((i) => byId(i.id)).filter(Boolean).slice(0, 4).map((p) => pic(U(p.imgs[0], 80))).join("")}</div><div class="kc-b"><span>${o.carrier} · ${esc(cu.city)}</span><div class="kc-mv">${si > 0 ? `<button type="button" data-mv="${o.id}:${OS[si - 1]}" aria-label="prev">←</button>` : ""}${si < 3 ? `<button type="button" data-mv="${o.id}:${OS[si + 1]}" aria-label="next">→</button>` : ""}</div></div><div class="trk"><i style="width:${(si + 1) * 25}%"></i></div></div>`; }).join("")}</div>`; }).join("")}</div>`;
}
let dragId = null;
document.addEventListener("dragstart", (e) => { const k = e.target.closest && e.target.closest("[data-kc]"); if (!k) return; dragId = k.dataset.kc; k.classList.add("drag"); try { e.dataTransfer.setData("text/plain", dragId); } catch (er) {} });
document.addEventListener("dragend", (e) => { const k = e.target.closest && e.target.closest("[data-kc]"); if (k) k.classList.remove("drag"); $$(".col.over").forEach((c) => c.classList.remove("over")); });
document.addEventListener("dragover", (e) => { const c = e.target.closest && e.target.closest("[data-col]"); if (!c || !dragId) return; e.preventDefault(); $$(".col").forEach((x) => x.classList.toggle("over", x === c)); });
document.addEventListener("drop", (e) => { const c = e.target.closest && e.target.closest("[data-col]"); if (!c || !dragId) return; e.preventDefault(); setStatus(dragId, c.dataset.col); dragId = null; renderCrm("ship"); });
/* clientes */
let UQ = "";
function crmUsers() {
  const c = t().crm.users; return `<div class="ch"><div><h1>${c.title}</h1><p>${CUSTOMERS.length + REQS.length} ${c.total.toLowerCase()}</p></div></div><div class="tools"><label class="tsearch">${ic("search")}<input id="usrQ" placeholder="${c.title}…" value="${esc(UQ)}"></label></div><div class="ucards" id="ucards"></div>`;
}
function paintUsers() {
  const c = t().crm.users; const A = allOrders(); const q = UQ.toLowerCase();
  const fromReq = REQS.map((r) => ({ id: "r" + r.code, name: r.name, city: es() ? "Catálogo" : "Catalog", phone: r.phone, email: r.email, since: 2026, img: "1534528741775-53994a69daeb", fresh: true }));
  const all = [...fromReq, ...CUSTOMERS].filter((u) => !q || (u.name + " " + u.city + " " + (u.email || "")).toLowerCase().includes(q));
  $("#ucards").innerHTML = all.map((u) => { const os0 = A.filter((o) => o.cust === u.id); const spent = os0.reduce((a, o) => a + o.total, 0); const last = os0[0];
    return `<div class="uc"><div class="uc-h">${pic(U(u.img, 120))}<div><b>${esc(u.name)}</b><span>${esc(u.city)}</span></div>${spent > 40000 ? `<span class="tag">${c.vip}</span>` : u.fresh ? `<span class="tag new">${es() ? "Nuevo" : "New"}</span>` : ""}</div><div class="uc-s"><div><b>${os0.length}</b><span>${c.orders}</span></div><div><b>${spent ? Math.round(spent / 1000) + "K" : "—"}</b><span>${c.spent}</span></div><div><b>${last ? fmtD(last.date, { day: "numeric", month: "short" }) : "—"}</b><span>${c.last}</span></div></div><div class="uc-c"><span>${esc(u.phone || "")}</span><span>${c.since} ${u.since}</span></div></div>`; }).join("");
}
/* solicitudes */
function crmReq() {
  const c = t().crm.reqs;
  return `<div class="ch"><div><h1>${c.title}</h1><p>${REQS.length} · ${newReqs()} ${es() ? "pendientes" : "pending"}</p></div></div>` + (REQS.length ? `<div class="ucards">${REQS.map((r, i) => `<div class="uc"><div class="uc-h"><div><b>${esc(r.name)}</b><span>${r.code} · ${fmtD(r.date, { day: "numeric", month: "short" })} · ${new Date(r.date).toLocaleTimeString(loc(), { hour: "2-digit", minute: "2-digit" })}</span></div>${r.converted ? `<span class="tag">${c.converted}</span>` : `<span class="tag new">${es() ? "Nueva" : "New"}</span>`}</div><div class="mc-imgs">${r.items.map((x) => byId(x.id)).filter(Boolean).map((p) => pic(U(p.imgs[0], 100))).join("")}</div><div class="lst">${r.items.map((x) => { const p = byId(x.id); return p ? `<div class="uc-c"><span>${esc(nameOf(p))}${x.size ? " · " + x.size : ""} × ${x.qty}</span><b>${rd(p.price * x.qty)}</b></div>` : ""; }).join("")}</div><div class="uc-c"><span>${c.via}: ${t().req.vias[r.via]} · ${esc(r.phone)}</span><b>${rd(r.total)}</b></div>${r.note ? `<p class="mut" style="font-size:12.5px">“${esc(r.note)}”</p>` : ""}${r.converted ? "" : `<button type="button" class="btn btn-acc btn-sm" data-convert="${i}">${c.convert}</button>`}</div>`).join("")}</div>` : `<div class="sel-empty">${ic("heart")}<p>${c.empty}</p><a href="#catalogo" class="btn btn-line">${t().list.go}</a></div>`);
}
function convertReq(i) {
  const r = REQS[i]; if (!r || r.converted) return;
  r.items.forEach((x) => { const p = byId(x.id); if (!p) return; if (typeof p.stock === "object") { if (x.size && p.stock[x.size] != null) p.stock[x.size] = Math.max(0, p.stock[x.size] - x.qty); } else p.stock = Math.max(0, p.stock - x.qty); });
  const cid = "r" + r.code; const o = { id: "V-" + (2481 + EXTRA_ORDERS.length), cust: cid, items: r.items.map((x) => ({ id: x.id, qty: x.qty, price: (byId(x.id) || { price: 0 }).price })), total: r.total, date: new Date().toISOString(), status: "paid", carrier: r.via === 2 ? CARRIERS[2] : CARRIERS[0], track: "TRK" + Math.floor(100000 + Math.random() * 899999), pay: "Transferencia" };
  if (!CUSTOMERS.find((c) => c.id === cid)) CUSTOMERS.unshift({ id: cid, name: r.name, city: es() ? "Catálogo" : "Catalog", phone: r.phone, email: r.email, since: 2026, img: "1534528741775-53994a69daeb", fresh: true });
  EXTRA_ORDERS.unshift(o); store.set("vt-orders", JSON.stringify(EXTRA_ORDERS)); r.converted = true; store.set("vt-reqs", JSON.stringify(REQS)); saveProducts();
  if (req && req.code === r.code) { req.status = 2; store.set("vt-req", JSON.stringify(req)); renderMine(); }
  toast(`✓ ${t().crm.reqs.converted} · ${o.id}`); renderCrm("req");
}
/* eventos del panel (llamados desde el manejador global) */
function crmClick(e, t0) {
  if (t0.closest("#sideBtn")) { $("#side").classList.toggle("open"); return true; }
  if (t0.closest("[data-pnew]")) { openPF(null); return true; }
  const pe = t0.closest("[data-pedit]"); if (pe) { openPF(pe.dataset.pedit); return true; }
  const sk = t0.closest("[data-stk]"); if (sk) { const [id, d] = sk.dataset.stk.split(":"); setStock(id, byId(id).stock + +d); return true; }
  const rs = t0.closest("[data-restock]"); if (rs) { const p = byId(rs.dataset.restock); if (typeof p.stock === "object") Object.keys(p.stock).forEach((k) => (p.stock[k] += 1)); else p.stock += 5; saveProducts(); toast(`✓ ${nameOf(p)} · ${stockOf(p)} ${t().st.units}`); renderCrm("dash"); return true; }
  const pb = t0.closest("[data-pub]"); if (pb) { const p = byId(pb.dataset.pub); p.hidden = !p.hidden; pb.classList.toggle("on", !p.hidden); saveProducts(); toast(p.hidden ? (es() ? "Oculto del catálogo" : "Hidden from catalog") : (es() ? "Publicado en el catálogo" : "Published in catalog")); return true; }
  const iv = t0.closest("[data-invf]"); if (iv) { INV.f = iv.dataset.invf; $$("[data-invf]").forEach((b) => b.classList.toggle("on", b === iv)); paintInv(); return true; }
  const of = t0.closest("[data-ordf]"); if (of) { ORD.f = of.dataset.ordf; $$("[data-ordf]").forEach((b) => b.classList.toggle("on", b === of)); paintOrders(); return true; }
  const od = t0.closest("[data-order]"); if (od) { openOrder(od.dataset.order); return true; }
  const st = t0.closest("[data-setst]"); if (st) { const [id, s] = st.dataset.setst.split(":"); setStatus(id, s); openOrder(id); if (route().p === "orders") paintOrders(); return true; }
  const mv = t0.closest("[data-mv]"); if (mv) { const [id, s] = mv.dataset.mv.split(":"); setStatus(id, s); renderCrm("ship"); return true; }
  const cv = t0.closest("[data-convert]"); if (cv) { convertReq(+cv.dataset.convert); return true; }
  if (t0.closest("[data-pfsized]")) { e.preventDefault(); syncPF(); PF.sized = !PF.sized; PF.stock = PF.sized ? Object.fromEntries(SIZES_DEF.map((s) => [s, 1])) : 5; drawPF(); return true; }
  const pr = t0.closest("[data-pfrm]"); if (pr) { e.preventDefault(); e.stopPropagation(); syncPF(); PF.imgs.splice(+pr.dataset.pfrm, 1); drawPF(); return true; }
  const pc = t0.closest("[data-pfcover]"); if (pc) { syncPF(); const [im] = PF.imgs.splice(+pc.dataset.pfcover, 1); PF.imgs.unshift(im); drawPF(); return true; }
  if (t0.closest("[data-pfsave]")) { savePF(); return true; }
  if (t0.closest("[data-pfdel]")) { const i = PRODUCTS.findIndex((p) => p.id === PF.id); if (i > -1) PRODUCTS.splice(i, 1); list = list.filter((x) => x.id !== PF.id); saveList(); saveProducts(); closeModal("pf"); toast(t().crm.form.deleted); renderCrm(route().p); return true; }
  if (e.target === $("#side") ? false : $("#side").classList.contains("open") && !t0.closest("#side")) { $("#side").classList.remove("open"); return true; }
  return false;
}
function crmChange(e) { if (e.target.id === "pfFile") addFiles(e.target.files); const si = e.target.closest("[data-stki]"); if (si) setStock(si.dataset.stki, +si.value); }
function crmInput(e) {
  if (e.target.id === "invQ") { INV.q = e.target.value; paintInv(); }
  if (e.target.id === "ordQ") { ORD.q = e.target.value; paintOrders(); }
  if (e.target.id === "usrQ") { UQ = e.target.value; paintUsers(); }
}
document.addEventListener("keydown", (e) => { const sw = e.target.closest && e.target.closest("[data-pub]"); if (sw && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); sw.click(); } });

/* ================= arranque ================= */
$("#tiles").innerHTML = "<i></i>".repeat(40);
applyText(); renderNav(); renderStore();
showView(false);
(function boot() {
  const ld = $("#loader");
  const fin = () => { firstLoad = false; if (cur && cur !== "panel") { if (ctx) ctx.revert(); enter(cur); } };
  if (!hasG || reduce) { ld.style.display = "none"; firstLoad = false; return; }
  const o = { v: 0 }; gsap.to(o, { v: 100, duration: 1.3, ease: "power2.inOut", onUpdate: () => ($("#ldN").textContent = Math.round(o.v) + "%"), onComplete: () => { ld.classList.add("out"); setTimeout(fin, 150); } });
})();
})();
</script></body></html>
